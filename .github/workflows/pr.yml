name: Continuous Integration
run-name: Fast PR Gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  canonical-proof:
    if: >-
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'ci-local-proof-bypass')
    permissions:
      actions: read
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/_canonical-proof.yml
    with:
      gate: fast

  pr-gate:
    name: pr-gate
    needs: canonical-proof
    if: >-
      always() && github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'ci-local-proof-bypass')
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require the exact canonical proof graph
        env:
          CANONICAL_PROOF_RESULT: ${{ needs.canonical-proof.result }}
        run: test "$CANONICAL_PROOF_RESULT" = success
