name: Continuous Deployment

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub-verified annotated tag to publish (vX.Y.Z)
        required: true
        type: string
      release_notes:
        description: Product-facing Markdown inserted before the generated install instructions
        required: true
        type: string
      provenance_run_id:
        description: Successful Release provenance Gate run for the tagged commit
        required: true
        type: string
      allow_non_latest_provenance:
        description: Publish from an older successful provenance run
        required: false
        default: false
        type: boolean
      bypass_reason:
        description: Required audit note when a non-latest provenance run is selected
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release-publisher
    permissions:
      actions: read
      contents: write
    outputs:
      release-sha: ${{ steps.admission.outputs.release-sha }}
    steps:
      - name: Validate deployment inputs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          PROVENANCE_RUN_ID: ${{ inputs.provenance_run_id }}
          ALLOW_NON_LATEST: ${{ inputs.allow_non_latest_provenance }}
          BYPASS_REASON: ${{ inputs.bypass_reason }}
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          test -n "$(printf '%s' "$RELEASE_NOTES" | tr -d '[:space:]')"
          printf '%s\n' "$PROVENANCE_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          if [ "$ALLOW_NON_LATEST" = true ] && [ -z "$BYPASS_REASON" ]; then
            echo 'A non-latest provenance bypass requires an audit note.' >&2
            exit 1
          fi
      - name: Check out signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ inputs.release_tag }}', fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22.22.1, cache: npm }
      - name: Install exact publication dependencies
        run: npm ci --ignore-scripts
      - name: Admit signed tag and exact provenance run
        id: admission
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PROVENANCE_RUN_ID: ${{ inputs.provenance_run_id }}
          ALLOW_NON_LATEST: ${{ inputs.allow_non_latest_provenance }}
          BYPASS_REASON: ${{ inputs.bypass_reason }}
        run: |
          release_sha=$(git rev-list -n 1 "$RELEASE_TAG")
          export GITHUB_SHA="$release_sha"
          GITHUB_REF_NAME="$RELEASE_TAG" node tooling/ci/release-policy.mjs
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROVENANCE_RUN_ID}")
          jq -e --arg sha "$release_sha" '
            .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and
            .status == "completed" and .path == ".github/workflows/quality-gate.yml"
            and .display_title == "Release provenance Gate"
          ' <<<"$run" >/dev/null
          jobs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${PROVENANCE_RUN_ID}/jobs?per_page=100")
          jq -s -e '
            [.[].jobs[] | select(.name == "Release provenance Gate" and .conclusion == "success")] |
            length == 1
          ' <<<"$jobs" >/dev/null
          runs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/quality-gate.yml/runs?branch=main&event=workflow_dispatch&status=completed&head_sha=${release_sha}&per_page=100")
          latest=$(jq -s -r --arg sha "$release_sha" '[.[].workflow_runs[] | select(.head_sha == $sha and .display_title == "Release provenance Gate")] | sort_by(.run_number) | last | .id // empty' <<<"$runs")
          if [ "$PROVENANCE_RUN_ID" != "$latest" ] && [ "$ALLOW_NON_LATEST" != true ]; then
            echo "Provenance run $PROVENANCE_RUN_ID is not the latest completed run $latest for $release_sha." >&2
            exit 1
          fi
          artifact_prefix="release-provenance-${release_sha}-${PROVENANCE_RUN_ID}-"
          artifact_name=$(node tooling/ci/resolve-run-artifact.mjs "$PROVENANCE_RUN_ID" "$artifact_prefix")
          gh run download "$PROVENANCE_RUN_ID" \
            --name "$artifact_name" \
            --dir build/release-proof
          node tooling/ci/verify-main-proof.mjs release build/release-proof "$release_sha"
          echo "release-sha=$release_sha" >> "$GITHUB_OUTPUT"
          {
            echo '### Continuous Deployment admission'
            echo
            echo "Tag: $RELEASE_TAG"
            echo "Commit: $release_sha"
            echo "Release provenance run: $PROVENANCE_RUN_ID"
            if [ -n "$BYPASS_REASON" ]; then echo "Bypass note: $BYPASS_REASON"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare immutable release assets
        env: { RELEASE_SHA: '${{ steps.admission.outputs.release-sha }}' }
        run: node tooling/ci/prepare-release-assets.mjs build/release-proof "$RELEASE_SHA"
      - name: Preserve publication input and prepared assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deployment-${{ steps.admission.outputs.release-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release-proof/proof-manifest.json
            build/release-proof/SHA256SUMS
            build/release-proof/release-assets
            .tmp/ci-release-admission.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Create draft, attach verified assets, and publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.admission.outputs.release-sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          asset_root=build/release-proof/release-assets
          GH_TOKEN="$RELEASE_POLICY_READ_TOKEN" GITHUB_SHA="$RELEASE_SHA" GITHUB_REF_NAME="$RELEASE_TAG" node tooling/ci/release-policy.mjs --recheck
          version=$(jq -er .version package.json)
          release_name="Sniptale ${version} alpha"
          lookup_error=$(mktemp)
          existing_release=$(mktemp)
          already_published=false
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >"$existing_release" 2>"$lookup_error"; then
            state=$(node tooling/ci/classify-release-state.mjs "$asset_root" "$RELEASE_TAG" "$release_name" <"$existing_release")
            release_id=$(jq -er .releaseId <<<"$state")
            case $(jq -er .action <<<"$state") in
              already-published)
                node tooling/ci/verify-published-release.mjs "$asset_root" "$release_id"
                already_published=true
                ;;
              recreate-owned-draft)
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
                ;;
              *)
                echo 'Existing release classifier returned an unknown action.' >&2
                exit 1
                ;;
            esac
          elif ! grep -q '(HTTP 404)' "$lookup_error"; then
            cat "$lookup_error" >&2
            exit 1
          fi
          created_release_id=''
          cleanup_owned_release() {
            if [ -z "$created_release_id" ]; then return; fi
            state=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${created_release_id}" --jq '[.tag_name, .draft, .immutable] | @tsv' 2>/dev/null || true)
            if [ "$state" = "${RELEASE_TAG}"$'\ttrue\tfalse' ] || [ "$state" = "${RELEASE_TAG}"$'\tfalse\tfalse' ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${created_release_id}"
            fi
          }
          trap cleanup_owned_release ERR
          mapfile -t zip_assets < <(find "$asset_root" -maxdepth 1 -type f -name 'sniptale_*.zip' ! -name '*-qa-evidence.zip' -print)
          test "${#zip_assets[@]}" -eq 1 && test -f "${zip_assets[0]}"
          zip_name=$(basename "${zip_assets[0]}")
          notes=$(mktemp)
          cat > "$notes" <<EOF
          Snip the web. Tell the story.

          Alpha preview of Sniptale — a local-first Chromium MV3 workspace for capturing, annotating, recording, reviewing, editing, and exporting the web.
          EOF
          printf '\n%s\n\n' "$RELEASE_NOTES" >> "$notes"
          cat >> "$notes" <<EOF
          ## Install

          Download **${zip_name}**, unpack it, open **chrome://extensions**, enable Developer mode, choose Load unpacked, and select the unpacked directory.

          This is an alpha preview (**v${version}-alpha**). Formats, workflows, and browser compatibility may change without backward compatibility; keep separate backups of important data.
          EOF
          request=$(mktemp)
          jq -n --arg tag "$RELEASE_TAG" --arg name "$release_name" --rawfile body "$notes" \
            '{tag_name: $tag, name: $name, body: $body, draft: true, prerelease: false, generate_release_notes: false}' > "$request"
          if [ "$already_published" = false ]; then
            release=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input "$request")
            release_id=$(jq -er --arg tag "$RELEASE_TAG" 'select(.tag_name == $tag and .draft == true and .immutable != true) | .id | tostring' <<<"$release")
            created_release_id="$release_id"
            node tooling/ci/upload-release-assets.mjs "$asset_root" "$release_id"
            node tooling/ci/verify-draft-release.mjs "$asset_root" "$release_id"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -F draft=false -f make_latest=true >/dev/null
            node tooling/ci/verify-published-release.mjs "$asset_root" "$release_id"
          fi

  coverage-results:
    needs: publish
    if: needs.publish.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ inputs.release_tag }}', persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22.22.1 }
      - name: Download exact published release proof
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          artifact_prefix="release-provenance-${{ needs.publish.outputs.release-sha }}-${{ inputs.provenance_run_id }}-"
          artifact_name=$(node tooling/ci/resolve-run-artifact.mjs "${{ inputs.provenance_run_id }}" "$artifact_prefix")
          gh run download "${{ inputs.provenance_run_id }}" \
            --name "$artifact_name" \
            --dir build/release-proof
          node tooling/ci/verify-main-proof.mjs release build/release-proof "${{ needs.publish.outputs.release-sha }}"
      - name: Publish exact release coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: build/release-proof/.tmp/coverage/canonical/lcov.info
          format: lcov
          git-branch: main
          git-commit: ${{ needs.publish.outputs.release-sha }}
          fail-on-error: true
          coverage-reporter-version: v0.6.22
