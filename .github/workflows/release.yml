name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  SNIPTALE_QA_CPU_TOKENS: '24'
  SNIPTALE_QA_MEMORY_MIB: '36864'
  SNIPTALE_QA_VITEST_MAX_WORKERS: '16'
  SNIPTALE_QA_PLAYWRIGHT_WORKERS: '4'
  SNIPTALE_QA_SECURITY_WORKERS: '8'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      main-run-id: ${{ steps.main-proof.outputs.run-id }}
      qa-image: ${{ steps.main-proof.outputs.qa-image }}
      controller-image: ${{ steps.controller-image.outputs.reference }}
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Check out signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22.12.0, cache: npm }
      - name: Validate tag, version, signature, and main ancestry
        env: { GH_TOKEN: '${{ secrets.RELEASE_POLICY_TOKEN || secrets.GITHUB_TOKEN }}' }
        run: node tooling/ci/release-policy.mjs
      - name: Download exact successful main proof
        id: main-proof
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          runs=$(gh run list --workflow quality-gate.yml --branch main --commit "$GITHUB_SHA" --event push --status success --limit 20 --json databaseId,headSha)
          main_run_id=$(jq -er --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)] | if length == 1 then .[0].databaseId else error("expected exactly one successful main proof") end' <<<"$runs")
          artifact_name="canonical-qa-${GITHUB_SHA}-${main_run_id}"
          gh run download "$main_run_id" --name "$artifact_name" --dir build/main-proof
          image_proof_name="qa-image-proof-${GITHUB_SHA}-${main_run_id}"
          gh run download "$main_run_id" --name "$image_proof_name" --dir build/image-proof
          node tooling/ci/verify-main-proof.mjs build/main-proof "$GITHUB_SHA"
          image_ref=$(node tooling/ci/image-proof.mjs verify build/image-proof "$GITHUB_SHA" "$main_run_id")
          echo "run-id=$main_run_id" >> "$GITHUB_OUTPUT"
          echo "qa-image=$image_ref" >> "$GITHUB_OUTPUT"
      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve exact controller image
        id: controller-image
        env: { CONTROLLER_TAG: 'ghcr.io/lrozhkov/sniptale-controller:sha-${{ github.sha }}' }
        run: |
          digest=$(docker buildx imagetools inspect "$CONTROLLER_TAG" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)
          if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo 'Unable to resolve immutable release controller image' >&2
            exit 1
          fi
          echo "reference=ghcr.io/lrozhkov/sniptale-controller@$digest" >> "$GITHUB_OUTPUT"
      - name: Preserve admitted main proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-input-${{ github.sha }}-${{ github.run_id }}
          path: build/main-proof
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  provision:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: selectel-runner-controller
    outputs:
      has-record: ${{ steps.record.outputs.exists }}
      label: ${{ steps.record.outputs.label }}
      attempt: ${{ steps.record.outputs.attempt }}
      server-id: ${{ steps.record.outputs.server_id }}
      availability-zone: ${{ steps.record.outputs.availability_zone }}
      cpu-tokens: ${{ steps.record.outputs.cpu_tokens }}
      memory-mib: ${{ steps.record.outputs.memory_mib }}
      vitest-workers: ${{ steps.record.outputs.vitest_workers }}
      playwright-workers: ${{ steps.record.outputs.playwright_workers }}
      security-workers: ${{ steps.record.outputs.security_workers }}
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', persist-credentials: false }
      - name: Provision disposable preemptible release runner
        env:
          CONTROLLER_IMAGE: ${{ needs.admission.outputs.controller-image }}
          SELECTEL_OS_AUTH_URL: ${{ vars.SELECTEL_OS_AUTH_URL }}
          SELECTEL_OS_REGION_NAME: ${{ vars.SELECTEL_OS_REGION_NAME }}
          SELECTEL_OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.SELECTEL_OS_APPLICATION_CREDENTIAL_ID }}
          SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET }}
          RUNNER_CONTROLLER_TOKEN: ${{ secrets.RUNNER_CONTROLLER_TOKEN }}
          RUNNER_IMAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_IMAGE_USER: ${{ github.actor }}
          SNIPTALE_CANDIDATE_SHA: ${{ github.sha }}
          SNIPTALE_QA_IMAGE: ${{ needs.admission.outputs.qa-image }}
        run: |
          printf '%s' "$RUNNER_IMAGE_TOKEN" | docker login ghcr.io --username "$RUNNER_IMAGE_USER" --password-stdin >/dev/null
          for attempt in 1 2 3; do
            export SNIPTALE_ATTEMPT="$attempt"
            if docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" \
              --env SELECTEL_OS_AUTH_URL --env SELECTEL_OS_REGION_NAME \
              --env SELECTEL_OS_APPLICATION_CREDENTIAL_ID --env SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET \
              --env RUNNER_CONTROLLER_TOKEN --env RUNNER_IMAGE_TOKEN --env RUNNER_IMAGE_USER \
              --env SNIPTALE_ATTEMPT --env SNIPTALE_CANDIDATE_SHA --env SNIPTALE_QA_IMAGE \
              --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT --env GITHUB_WORKFLOW \
              "$CONTROLLER_IMAGE" provision; then
              printf '%s\n' "$attempt" > build/selectel-controller/selected-attempt.txt
              exit 0
            fi
            record="build/selectel-controller/attempt-${attempt}.json"
            if [ ! -f "$record" ]; then
              echo "Provision attempt ${attempt} failed without a sanitized record" >&2
              exit 1
            fi
            jq -e '
              .status == "provision-failed" and
              (.cleanup | type == "object") and
              ([.cleanup[]] | all(. == "absent" or . == "deleted"))
            ' "$record" >/dev/null
          done
          echo 'All bounded Selectel release placements were exhausted' >&2
          exit 1
      - name: Export sanitized runner identity
        id: record
        if: always()
        run: |
          selected=build/selectel-controller/selected-attempt.txt
          if [ ! -f "$selected" ]; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          attempt=$(cat "$selected")
          record="build/selectel-controller/attempt-${attempt}.json"
          echo 'exists=true' >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "label=$(jq -er .runnerLabel "$record")" >> "$GITHUB_OUTPUT"
          echo "server_id=$(jq -er .serverId "$record")" >> "$GITHUB_OUTPUT"
          echo "availability_zone=$(jq -er .availabilityZone "$record")" >> "$GITHUB_OUTPUT"
          echo "cpu_tokens=$(jq -er .resourceProfile.cpuTokens "$record")" >> "$GITHUB_OUTPUT"
          echo "memory_mib=$(jq -er .resourceProfile.memoryMiB "$record")" >> "$GITHUB_OUTPUT"
          echo "vitest_workers=$(jq -er .resourceProfile.vitestWorkers "$record")" >> "$GITHUB_OUTPUT"
          echo "playwright_workers=$(jq -er .resourceProfile.playwrightWorkers "$record")" >> "$GITHUB_OUTPUT"
          echo "security_workers=$(jq -er .resourceProfile.securityWorkers "$record")" >> "$GITHUB_OUTPUT"
      - name: Preserve sanitized controller record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-selectel-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/selectel-controller/attempt-*.json
            build/selectel-controller/selected-attempt.txt
          if-no-files-found: warn
          retention-days: 30

  release-audit:
    needs: [admission, provision]
    if: needs.provision.result == 'success'
    runs-on: ${{ fromJSON(format('["self-hosted","{0}"]', needs.provision.outputs.label)) }}
    timeout-minutes: 120
    permissions: { actions: read, contents: read }
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false }
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22.12.0, cache: npm }
      - name: Download admitted main proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          {
            name: 'release-input-${{ github.sha }}-${{ github.run_id }}',
            path: admitted-main-proof,
          }
      - name: Restore verified main CodeQL proof
        run: |
          codeql_proof="$RUNNER_TEMP/codeql-proof-${GITHUB_SHA}.json"
          codeql_sarif="$RUNNER_TEMP/codeql-sarif-${GITHUB_SHA}.sarif"
          node tooling/ci/select-codeql-proof.mjs admitted-main-proof "$GITHUB_SHA" "$codeql_proof" "$codeql_sarif"
          echo "SNIPTALE_CODEQL_PROOF_PATH=$codeql_proof" >> "$GITHUB_ENV"
          echo "SNIPTALE_CODEQL_SARIF_PATH=$codeql_sarif" >> "$GITHUB_ENV"
      - name: Run release-only canonical audit
        env:
          SNIPTALE_CANDIDATE_SHA: ${{ github.sha }}
          SNIPTALE_CI_IMAGE: ${{ needs.admission.outputs.qa-image }}
          SNIPTALE_CI_SKIP_BUILD: '1'
          SNIPTALE_SELECTEL_ATTEMPT: ${{ needs.provision.outputs.attempt }}
          SNIPTALE_SELECTEL_SERVER_ID: ${{ needs.provision.outputs.server-id }}
          SNIPTALE_SELECTEL_AVAILABILITY_ZONE: ${{ needs.provision.outputs.availability-zone }}
          SNIPTALE_QA_CPU_TOKENS: ${{ needs.provision.outputs.cpu-tokens }}
          SNIPTALE_QA_MEMORY_MIB: ${{ needs.provision.outputs.memory-mib }}
          SNIPTALE_QA_VITEST_MAX_WORKERS: ${{ needs.provision.outputs.vitest-workers }}
          SNIPTALE_QA_PLAYWRIGHT_WORKERS: ${{ needs.provision.outputs.playwright-workers }}
          SNIPTALE_QA_SECURITY_WORKERS: ${{ needs.provision.outputs.security-workers }}
        run: node tooling/ci/container.mjs release-audit
      - name: Preserve release audit proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-audit-${{ github.sha }}-${{ github.run_id }}
          path: build/ci-artifacts/release-audit-${{ github.sha }}-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  cleanup:
    needs: [admission, provision, release-audit]
    if: always() && needs.provision.outputs.has-record == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: selectel-runner-controller
    permissions: { actions: read, contents: read, packages: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: { name: 'release-selectel-${{ github.sha }}-${{ github.run_id }}', path: attempt }
      - name: Delete release VM, volume, port, and JIT registration
        env:
          CONTROLLER_IMAGE: ${{ needs.admission.outputs.controller-image }}
          SELECTEL_OS_AUTH_URL: ${{ vars.SELECTEL_OS_AUTH_URL }}
          SELECTEL_OS_REGION_NAME: ${{ vars.SELECTEL_OS_REGION_NAME }}
          SELECTEL_OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.SELECTEL_OS_APPLICATION_CREDENTIAL_ID }}
          SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET }}
          RUNNER_CONTROLLER_TOKEN: ${{ secrets.RUNNER_CONTROLLER_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null
          attempt=$(cat attempt/selected-attempt.txt)
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" \
            --env SELECTEL_OS_AUTH_URL --env SELECTEL_OS_REGION_NAME \
            --env SELECTEL_OS_APPLICATION_CREDENTIAL_ID --env SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET \
            --env RUNNER_CONTROLLER_TOKEN "$CONTROLLER_IMAGE" cleanup \
            "/workspace/attempt/attempt-${attempt}.json"
      - name: Preserve cleanup proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-cleanup-${{ github.sha }}-${{ github.run_id }}
          path: |
            attempt/attempt-*.json
            attempt/selected-attempt.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [admission, release-audit, cleanup]
    if: needs.release-audit.result == 'success' && needs.cleanup.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22.12.0, cache: npm }
      - name: Download admitted main proof and release audit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          {
            pattern: 'release-*-${{ github.sha }}-${{ github.run_id }}',
            path: build/release-inputs,
          }
      - name: Restore canonical artifact roots
        run: |
          mv build/release-inputs/release-input-${GITHUB_SHA}-${GITHUB_RUN_ID} build/main-proof
          mv build/release-inputs/release-audit-${GITHUB_SHA}-${GITHUB_RUN_ID} build/release-audit
      - name: Prepare immutable release assets
        run: node tooling/ci/prepare-release-assets.mjs build/main-proof build/release-audit "$GITHUB_SHA"
      - name: Preserve release proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/main-proof
            build/release-audit
          include-hidden-files: true
          retention-days: 30
      - name: Create draft, attach verified assets, and publish
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          RELEASE_POLICY_READ_TOKEN: '${{ secrets.RELEASE_POLICY_TOKEN || secrets.GITHUB_TOKEN }}'
        run: |
          asset_root="build/main-proof/release-assets"
          GH_TOKEN="$RELEASE_POLICY_READ_TOKEN" node tooling/ci/release-policy.mjs --recheck
          lookup_error=$(mktemp)
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" >/dev/null 2>"$lookup_error"; then
            echo "Refusing to replace an existing release" >&2
            exit 1
          elif ! grep -q '(HTTP 404)' "$lookup_error"; then
            cat "$lookup_error" >&2
            exit 1
          fi
          created_release_id=''
          cleanup_owned_release() {
            if [ -z "$created_release_id" ]; then return; fi
            release_state=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${created_release_id}" --jq '[.tag_name, .draft, .immutable] | @tsv' 2>/dev/null || true)
            if [ "$release_state" = "${GITHUB_REF_NAME}"$'\ttrue\tfalse' ] || [ "$release_state" = "${GITHUB_REF_NAME}"$'\tfalse\tfalse' ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${created_release_id}"
            fi
          }
          trap cleanup_owned_release ERR
          version=$(jq -er .version package.json)
          zip_assets=("$asset_root"/*.zip)
          if [ "${#zip_assets[@]}" -ne 1 ] || [ ! -f "${zip_assets[0]}" ]; then
            echo "Expected exactly one verified extension ZIP" >&2
            exit 1
          fi
          zip_name=$(basename "${zip_assets[0]}")
          release_notes=$(mktemp)
          cat > "$release_notes" <<EOF
          Snip the web. Tell the story.

          Fourth public alpha preview of Sniptale — a local-first Chromium MV3 workspace for capturing, annotating, recording, reviewing, editing, and exporting the web.

          ## Highlights

          - Added one canonical, reproducible QA path for local machines and GitHub, preserving the established release-harness, checkpoint, closeout, release, security, and coverage semantics.
          - Added disposable preemptible Selectel runners with bounded multi-zone capacity fallback, explicit resource profiles, no public ingress, and mandatory cleanup proof.
          - Added verified unit and CodeQL proof reuse, candidate-bound receipts, immutable QA images, SBOM and provenance, SARIF publication, coverage artifacts, and informational Codecov reporting.
          - Improved CI failure diagnostics with retained wrapper run records, complete sanitized logs, report hashes, artifact download guidance, and deterministic proof manifests.
          - Hardened release admission around signed tags, successful main proof, immutable release assets, checksums, CycloneDX SBOM, and exact artifact verification.

          ## Install

          Download **${zip_name}**, unpack it, open **chrome://extensions**, enable Developer mode, choose Load unpacked, and select the unpacked directory.

          This is still an alpha preview (**v${version}-alpha**). Formats, workflows, and browser compatibility may change without backward compatibility; keep separate backups of important data.
          EOF
          release_request=$(mktemp)
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg name "Sniptale ${version} alpha" \
            --rawfile body "$release_notes" \
            '{tag_name: $tag, name: $name, body: $body, draft: true, prerelease: false, generate_release_notes: false}' \
            > "$release_request"
          release_json=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input "$release_request")
          release_id=$(jq -er --arg tag "$GITHUB_REF_NAME" 'select(.tag_name == $tag and .draft == true and .immutable != true) | .id | tostring' <<<"$release_json")
          created_release_id="$release_id"
          node tooling/ci/upload-release-assets.mjs "$asset_root" "$release_id"
          node tooling/ci/verify-draft-release.mjs "$asset_root" "$release_id"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -F draft=false -f make_latest=true >/dev/null
          node tooling/ci/verify-published-release.mjs "$asset_root" "$release_id"
