name: Continuous Deployment
run-name: ${{ inputs.diagnostic && 'Continuous Deployment diagnostic' || 'Continuous Deployment' }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub-verified annotated tag to publish (vX.Y.Z)
        required: true
        type: string
      release_notes:
        description: Product-facing Markdown inserted before the generated install instructions
        required: true
        type: string
      provenance_run_id:
        description: Successful provenance finalizer run for the tagged commit
        required: true
        type: string
      diagnostic:
        description: Admit and prepare the exact release without creating or publishing it
        required: false
        default: false
        type: boolean
      allow_non_latest_provenance:
        description: Publish from an older successful provenance run
        required: false
        default: false
        type: boolean
      bypass_reason:
        description: Required audit note when a non-latest provenance run is selected
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  admission:
    if: github.ref == 'refs/heads/main' || inputs.diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      release-sha: ${{ steps.admission.outputs.release-sha }}
    steps:
      - name: Validate deployment inputs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          PROVENANCE_RUN_ID: ${{ inputs.provenance_run_id }}
          ALLOW_NON_LATEST: ${{ inputs.allow_non_latest_provenance }}
          BYPASS_REASON: ${{ inputs.bypass_reason }}
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          test -n "$(printf '%s' "$RELEASE_NOTES" | tr -d '[:space:]')"
          printf '%s\n' "$PROVENANCE_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          if [ "$ALLOW_NON_LATEST" = true ] && [ -z "$BYPASS_REASON" ]; then
            echo 'A non-latest provenance bypass requires an audit note.' >&2
            exit 1
          fi
      - name: Check out signed tag
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ inputs.release_tag }}', fetch-depth: 0, persist-credentials: false }
      - name: Check out diagnostic candidate
        if: github.ref != 'refs/heads/main' && inputs.diagnostic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false }
      - name: Check out release control
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', path: release-control, persist-credentials: false }
      - uses: ./.github/actions/setup-locked-node
        with: { cache: npm, cache-dependency-path: package-lock.json }
      - name: Install locked npm
        run: npm ci --ignore-scripts --prefix tooling/configs/ci/npm && echo "$GITHUB_WORKSPACE/tooling/configs/ci/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install exact publication dependencies
        run: npm ci --ignore-scripts
      - name: Admit exact provenance source
        id: admission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PROVENANCE_RUN_ID: ${{ inputs.provenance_run_id }}
          ALLOW_NON_LATEST: ${{ inputs.allow_non_latest_provenance }}
          BYPASS_REASON: ${{ inputs.bypass_reason }}
          BRANCH_DIAGNOSTIC: ${{ github.ref != 'refs/heads/main' && inputs.diagnostic }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH_DIAGNOSTIC" = true ]; then
            release_sha=$(git rev-parse HEAD)
            version=$(jq -er .version package.json)
            test "$RELEASE_TAG" = "v${version}"
            run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROVENANCE_RUN_ID}")
            jq -e --arg sha "$release_sha" --arg branch "$SOURCE_BRANCH" '
              .head_sha == $sha and .head_branch == $branch and .event == "workflow_dispatch" and
              .status == "completed" and .conclusion == "success" and
              .path == ".github/workflows/provenance.yml" and
              .display_title == "Release pipeline diagnostic"
            ' <<<"$run" >/dev/null
            jobs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${PROVENANCE_RUN_ID}/jobs?per_page=100")
            jq -s -e '
              [.[].jobs[] | select(.name == "Release pipeline diagnostic Gate" and .conclusion == "success")] |
              length == 1
            ' <<<"$jobs" >/dev/null
            artifact_prefix="release-provenance-${release_sha}-${PROVENANCE_RUN_ID}-"
            artifact_name=$(node tooling/ci/resolve-run-artifact.mjs "$PROVENANCE_RUN_ID" "$artifact_prefix")
            gh run download "$PROVENANCE_RUN_ID" --name "$artifact_name" --dir build/release-proof
            node tooling/ci/verify-main-proof.mjs release build/release-proof "$release_sha"
            node tooling/ci/prepare-release-assets.mjs build/release-proof "$release_sha"
            mkdir -p .tmp
            jq -n \
              --arg commit "$release_sha" \
              --arg tag "$RELEASE_TAG" \
              --argjson provenanceRunId "$PROVENANCE_RUN_ID" \
              '{schemaVersion: 1, artifactKind: "sniptale-branch-diagnostic-release-admission", commit: $commit, tag: $tag, provenanceRunId: $provenanceRunId, remoteAuthorities: "deferred-to-main"}' \
              > .tmp/ci-release-admission.json
            jq -n \
              --arg commit "$release_sha" \
              '{schemaVersion: 1, artifactKind: "sniptale-branch-diagnostic-attestation-disposition", commit: $commit, status: "deferred-to-main"}' \
              > build/release-proof/attestations.json
          else
            release_sha=$(git rev-list -n 1 "$RELEASE_TAG")
            export GITHUB_SHA="$release_sha"
            GITHUB_REF_NAME="$RELEASE_TAG" node tooling/ci/release-policy.mjs
            run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROVENANCE_RUN_ID}")
            control_sha=$(jq -er .head_sha <<<"$run")
            jq -e '
              .head_branch == "main" and .event == "workflow_dispatch" and
              .status == "completed" and .conclusion == "success" and
              .path == ".github/workflows/provenance-finalize.yml" and
              .display_title == "Release provenance Finalize Gate"
            ' <<<"$run" >/dev/null
            jobs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${PROVENANCE_RUN_ID}/jobs?per_page=100")
            jq -s -e '
              [.[].jobs[] | select(.name == "Release provenance Finalize Gate" and .conclusion == "success")] |
              length == 1
            ' <<<"$jobs" >/dev/null
            runs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/provenance-finalize.yml/runs?branch=main&event=workflow_dispatch&status=completed&head_sha=${control_sha}&per_page=100")
            latest=$(jq -s -r '[.[].workflow_runs[] | select(.conclusion == "success" and .display_title == "Release provenance Finalize Gate")] | sort_by(.run_number) | last | .id // empty' <<<"$runs")
            if [ "$PROVENANCE_RUN_ID" != "$latest" ] && [ "$ALLOW_NON_LATEST" != true ]; then
              echo "Finalizer run $PROVENANCE_RUN_ID is not the latest completed run $latest for control $control_sha." >&2
              exit 1
            fi
            finalized_prefix="release-finalized-assets-${release_sha}-${PROVENANCE_RUN_ID}-"
            finalized_name=$(node tooling/ci/resolve-run-artifact.mjs "$PROVENANCE_RUN_ID" "$finalized_prefix")
            gh run download "$PROVENANCE_RUN_ID" \
              --name "$finalized_name" \
              --dir build/release-finalized
            finalizer=$(node release-control/tooling/ci/verify-finalizer-admission.mjs \
              build/release-finalized/finalizer-admission.json "$release_sha" "$control_sha" "$PROVENANCE_RUN_ID")
            source_run_id=$(jq -er .sourceProofRunId <<<"$finalizer")
            source_attempt=$(jq -er .sourceProofRunAttempt <<<"$finalizer")
            source=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}")
            jq -e --arg sha "$release_sha" '
              .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and
              .status == "completed" and
              .path == ".github/workflows/provenance.yml" and
              .display_title == "Release provenance Gate"
            ' <<<"$source" >/dev/null
            source_jobs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}/jobs?filter=all&per_page=100")
            jq -s -e '
              [.[].jobs[] | select(.name == "canonical-proof / Release provenance Gate" and .conclusion == "success")] |
              length >= 1
            ' <<<"$source_jobs" >/dev/null
            proof_name="release-provenance-${release_sha}-${source_run_id}-${source_attempt}"
            gh run download "$source_run_id" --name "$proof_name" --dir build/release-proof
            node tooling/ci/verify-main-proof.mjs release build/release-proof "$release_sha"
            cp -R build/release-finalized/release-assets build/release-proof/release-assets
            cp build/release-finalized/attestations.json build/release-proof/attestations.json
            cp build/release-finalized/finalizer-admission.json build/release-proof/finalizer-admission.json
          fi
          node tooling/ci/verify-release-assets.mjs build/release-proof "$release_sha"
          if [ "$BRANCH_DIAGNOSTIC" != true ]; then
            while IFS= read -r subject; do
              gh attestation verify "build/release-proof/release-assets/$subject" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/provenance-finalize.yml" \
                --source-ref refs/heads/main \
                --source-digest "$control_sha" \
                --deny-self-hosted-runners >/dev/null
            done < <(find build/release-proof/release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          fi
          echo "release-sha=$release_sha" >> "$GITHUB_OUTPUT"
          {
            echo '### Continuous Deployment admission'
            echo
            echo "Tag: $RELEASE_TAG"
            echo "Commit: $release_sha"
            echo "Release provenance run: $PROVENANCE_RUN_ID"
            if [ "$BRANCH_DIAGNOSTIC" = true ]; then
              echo 'Remote tag and GitHub attestation admission: deferred to main diagnostic'
            fi
            if [ -n "$BYPASS_REASON" ]; then echo "Bypass note: $BYPASS_REASON"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare notes and classify existing release state without mutation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          asset_root=build/release-proof/release-assets
          deployment_root=build/release-proof/deployment
          mkdir -p "$deployment_root"
          version=$(jq -er .version package.json)
          release_name="Sniptale ${version} alpha"
          mapfile -t zip_assets < <(find "$asset_root" -maxdepth 1 -type f -name 'sniptale_*.zip' ! -name '*-qa-evidence.zip' -print)
          test "${#zip_assets[@]}" -eq 1 && test -f "${zip_assets[0]}"
          zip_name=$(basename "${zip_assets[0]}")
          notes="$deployment_root/release-notes.md"
          cat > "$notes" <<EOF
          Snip the web. Tell the story.

          Alpha preview of Sniptale — a local-first Chromium MV3 workspace for capturing, annotating, recording, reviewing, editing, and exporting the web.
          EOF
          printf '\n%s\n\n' "$RELEASE_NOTES" >> "$notes"
          cat >> "$notes" <<EOF
          ## Install

          Download **${zip_name}**, unpack it, open **chrome://extensions**, enable Developer mode, choose Load unpacked, and select the unpacked directory.

          This is an alpha preview (**v${version}-alpha**). Formats, workflows, and browser compatibility may change without backward compatibility; keep separate backups of important data.
          EOF
          jq -n --arg tag "$RELEASE_TAG" --arg name "$release_name" --rawfile body "$notes" \
            '{tag_name: $tag, name: $name, body: $body, draft: true, prerelease: false, generate_release_notes: false}' \
            > "$deployment_root/release-request.json"
          lookup_error=$(mktemp)
          existing_release=$(mktemp)
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >"$existing_release" 2>"$lookup_error"; then
            node tooling/ci/classify-release-state.mjs "$asset_root" "$RELEASE_TAG" "$release_name" \
              <"$existing_release" > "$deployment_root/existing-release-state.json"
          elif grep -q '(HTTP 404)' "$lookup_error"; then
            jq -n '{action: "create-release"}' > "$deployment_root/existing-release-state.json"
          else
            cat "$lookup_error" >&2
            exit 1
          fi
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg name "$release_name" \
            --arg zip "$zip_name" \
            --slurpfile state "$deployment_root/existing-release-state.json" \
            '{schemaVersion: 1, tag: $tag, name: $name, extensionArchive: $zip, existingRelease: $state[0]}' \
            > "$deployment_root/deployment-plan.json"
          {
            echo
            echo "Mode: ${{ inputs.diagnostic && 'diagnostic (no publication)' || 'publication' }}"
            echo "Prepared extension archive: $zip_name"
            echo "Existing release action: $(jq -er .action "$deployment_root/existing-release-state.json")"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve publication input and prepared assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deployment-${{ steps.admission.outputs.release-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release-proof/proof-manifest.json
            build/release-proof/SHA256SUMS
            build/release-proof/release-assets
            build/release-proof/attestations.json
            build/release-proof/deployment
            .tmp/ci-release-admission.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  diagnostic-gate:
    name: Continuous Deployment diagnostic Gate
    needs: admission
    if: always() && inputs.diagnostic
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require read-only release admission and preparation
        env:
          ADMISSION_RESULT: ${{ needs.admission.result }}
        run: test "$ADMISSION_RESULT" = success

  publish:
    needs: admission
    if: github.ref == 'refs/heads/main' && needs.admission.result == 'success' && !inputs.diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-publisher
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ inputs.release_tag }}', fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-locked-node
        with: { cache: npm, cache-dependency-path: package-lock.json }
      - name: Install locked npm
        run: npm ci --ignore-scripts --prefix tooling/configs/ci/npm && echo "$GITHUB_WORKSPACE/tooling/configs/ci/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install exact publication dependencies
        run: npm ci --ignore-scripts
      - name: Download exact admitted deployment artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0
        with:
          name: deployment-${{ needs.admission.outputs.release-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Create draft, attach verified assets, and publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.admission.outputs.release-sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          asset_root=build/release-proof/release-assets
          deployment_root=build/release-proof/deployment
          GH_TOKEN="$RELEASE_POLICY_READ_TOKEN" GITHUB_SHA="$RELEASE_SHA" GITHUB_REF_NAME="$RELEASE_TAG" node tooling/ci/release-policy.mjs --recheck
          node tooling/ci/verify-release-assets.mjs build/release-proof "$RELEASE_SHA"
          request="$deployment_root/release-request.json"
          release_name=$(jq -er --arg tag "$RELEASE_TAG" 'select(.tag_name == $tag and .draft == true and .prerelease == false and .generate_release_notes == false) | .name' "$request")
          lookup_error=$(mktemp)
          existing_release=$(mktemp)
          already_published=false
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >"$existing_release" 2>"$lookup_error"; then
            state=$(node tooling/ci/classify-release-state.mjs "$asset_root" "$RELEASE_TAG" "$release_name" <"$existing_release")
            release_id=$(jq -er .releaseId <<<"$state")
            case $(jq -er .action <<<"$state") in
              already-published)
                node tooling/ci/verify-published-release.mjs "$asset_root" "$release_id"
                already_published=true
                ;;
              recreate-owned-draft)
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
                ;;
              *)
                echo 'Existing release classifier returned an unknown action.' >&2
                exit 1
                ;;
            esac
          elif ! grep -q '(HTTP 404)' "$lookup_error"; then
            cat "$lookup_error" >&2
            exit 1
          fi
          created_release_id=''
          cleanup_owned_release() {
            if [ -z "$created_release_id" ]; then return; fi
            state=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${created_release_id}" --jq '[.tag_name, .draft, .immutable] | @tsv' 2>/dev/null || true)
            if [ "$state" = "${RELEASE_TAG}"$'\ttrue\tfalse' ] || [ "$state" = "${RELEASE_TAG}"$'\tfalse\tfalse' ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${created_release_id}"
            fi
          }
          trap cleanup_owned_release ERR
          mapfile -t zip_assets < <(find "$asset_root" -maxdepth 1 -type f -name 'sniptale_*.zip' ! -name '*-qa-evidence.zip' -print)
          test "${#zip_assets[@]}" -eq 1 && test -f "${zip_assets[0]}"
          if [ "$already_published" = false ]; then
            release=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input "$request")
            release_id=$(jq -er --arg tag "$RELEASE_TAG" 'select(.tag_name == $tag and .draft == true and .immutable != true) | .id | tostring' <<<"$release")
            created_release_id="$release_id"
            node tooling/ci/upload-release-assets.mjs "$asset_root" "$release_id"
            node tooling/ci/verify-draft-release.mjs "$asset_root" "$release_id"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -F draft=false -f make_latest=true >/dev/null
            node tooling/ci/verify-published-release.mjs "$asset_root" "$release_id"
          fi
