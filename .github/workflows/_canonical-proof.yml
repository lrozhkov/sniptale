name: Canonical proof

on:
  workflow_call:
    inputs:
      gate:
        description: Exact canonical proof mode
        required: true
        type: string
      force_rebuild:
        description: Build separate forced candidate images
        required: false
        default: false
        type: boolean
      force_rebuild_reason:
        description: Required audit reason for a forced rebuild
        required: false
        default: ''
        type: string
      release_diagnostic:
        description: Allow the release QA graph on a branch without publishing release outputs
        required: false
        default: false
        type: boolean
      bypass_reason:
        description: Optional operator note recorded in the run summary
        required: false
        default: ''
        type: string
    secrets:
      SELECTEL_OS_APPLICATION_CREDENTIAL_ID:
        description: Environment-owned Selectel application credential identifier
        required: false
      SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET:
        description: Environment-owned Selectel application credential secret
        required: false
      RUNNER_CONTROLLER_TOKEN:
        description: Environment-owned GitHub runner registration controller token
        required: false

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  TRUSTED_CONTROL_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
  GATE_MODE: ${{ inputs.gate }}
  PROOF_LANE: ${{ inputs.gate == 'release-provenance' && 'release' || 'proof' }}
  PROOF_KIND: ${{ inputs.gate == 'release-provenance' && 'release-provenance' || 'fast-proof' }}

jobs:
  fast-classifier:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'ci-local-proof-bypass')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      reuse: ${{ steps.admission.outputs.reuse }}
      controls-changed: ${{ steps.classify.outputs.controls-changed }}
      candidate-control-digest: ${{ steps.classify.outputs.candidate-control-digest }}
      trusted-control-digest: ${{ steps.classify.outputs.trusted-control-digest }}
    permissions: { actions: read, contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            ref: '${{ env.TRUSTED_CONTROL_SHA }}',
            path: trusted-control,
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            ref: '${{ env.CANDIDATE_SHA }}',
            path: candidate,
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: ./trusted-control/.github/actions/setup-locked-node
        with: { repository-root: trusted-control }
      - name: Classify every fast-gate input with trusted base controls
        id: classify
        run: node trusted-control/tooling/ci/classify-fast-gate.mjs trusted-control candidate "$BASE_SHA" "$CANDIDATE_SHA"
      - name: Report candidate QA control disposition
        env:
          CONTROLS_CHANGED: ${{ steps.classify.outputs.controls-changed }}
          CANDIDATE_CONTROL_DIGEST: ${{ steps.classify.outputs.candidate-control-digest }}
          TRUSTED_CONTROL_DIGEST: ${{ steps.classify.outputs.trusted-control-digest }}
        run: |
          disposition=trusted-controls
          if [ "$CONTROLS_CHANGED" = true ]; then disposition=candidate-controls; fi
          {
            echo '### QA control authority'
            echo
            echo "QA controls changed: $CONTROLS_CHANGED"
            echo "Control disposition: $disposition"
            echo "Candidate control digest: $CANDIDATE_CONTROL_DIGEST"
            echo "Trusted control digest: $TRUSTED_CONTROL_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install locked npm
        if: steps.classify.outputs.reuse == 'true'
        run: npm ci --ignore-scripts --prefix candidate/tooling/configs/ci/npm && echo "$GITHUB_WORKSPACE/candidate/tooling/configs/ci/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.classify.outputs.reuse == 'true'
        with:
          path: candidate/.tmp/npm-cache
          key: npm-${{ runner.os }}-${{ runner.arch }}-node-24.18.0-toolchain-${{ hashFiles('candidate/tooling/configs/ci/toolchain.lock.json') }}-lock-${{ hashFiles('candidate/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ runner.arch }}-node-24.18.0-toolchain-${{ hashFiles('candidate/tooling/configs/ci/toolchain.lock.json') }}-
      - name: Restore the exact successful base proof
        id: source
        if: steps.classify.outputs.reuse == 'true'
        continue-on-error: true
        working-directory: candidate
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: node ../trusted-control/tooling/ci/restore-fast-proof.mjs "$BASE_SHA" "$RUNNER_TEMP/base-fast-proof"
      - name: Install exact candidate dependencies for non-gate validators
        id: install
        if: steps.source.outcome == 'success'
        continue-on-error: true
        working-directory: candidate
        env:
          npm_config_cache: ${{ github.workspace }}/candidate/.tmp/npm-cache
        run: npm ci --ignore-scripts
      - name: Derive a candidate-bound proof without Selectel
        id: derive
        if: steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: candidate
        run: node tooling/ci/derive-fast-proof.mjs "$RUNNER_TEMP/base-fast-proof" "build/ci-artifacts/proof-${CANDIDATE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$BASE_SHA"
      - name: Publish docs-only admission decision
        id: admission
        if: always()
        env:
          REUSABLE_INPUTS: ${{ steps.classify.outputs.reuse }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          DERIVE_OUTCOME: ${{ steps.derive.outcome }}
        run: |
          reuse=false
          if [ "$REUSABLE_INPUTS" = true ] && [ "$SOURCE_OUTCOME" = success ] && [ "$INSTALL_OUTCOME" = success ] && [ "$DERIVE_OUTCOME" = success ]; then reuse=true; fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.admission.outputs.reuse == 'true'
        with:
          name: fast-proof-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/build/ci-artifacts/proof-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  qa-image:
    needs: fast-classifier
    if: >-
      always() &&
      needs.fast-classifier.outputs.reuse != 'true' &&
      (needs.fast-classifier.result == 'success' || needs.fast-classifier.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.gate != 'selectel-connectivity') &&
      (github.event_name != 'workflow_dispatch' || inputs.gate != 'selectel-recovery') &&
      (github.event_name != 'workflow_dispatch' || inputs.gate != 'release-provenance' || github.ref == 'refs/heads/main' || inputs.release_diagnostic) &&
      (github.event_name != 'workflow_dispatch' || inputs.gate != 'selectel-smoke' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || (inputs.release_diagnostic && inputs.gate == 'release-provenance')) &&
      (github.event_name != 'schedule' || github.event.schedule != '17 3 * * *') &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.draft == false) &&
      (github.event_name != 'pull_request_target' || !contains(github.event.pull_request.labels.*.name, 'ci-local-proof-bypass'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      reference: ${{ steps.reference.outputs.reference }}
      controller-reference: ${{ steps.reference.outputs.controller-reference }}
    permissions: { contents: read, packages: write }
    env:
      QA_CACHE_EXPORT: type=gha,mode=min,scope=sniptale-qa,ignore-error=true
      CONTROLLER_CACHE_EXPORT: type=gha,mode=min,scope=sniptale-controller,ignore-error=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            ref: '${{ env.TRUSTED_CONTROL_SHA }}',
            path: trusted-control,
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            ref: '${{ env.CANDIDATE_SHA }}',
            path: candidate,
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: ./trusted-control/.github/actions/setup-locked-node
        with: { repository-root: trusted-control }
      - name: Bind candidate and trusted QA control digests
        id: controls
        run: |
          result=$(node trusted-control/tooling/ci/check-control-authority.mjs trusted-control candidate)
          echo "controls-changed=$(jq -r .controlsChanged <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "candidate-control-digest=$(jq -r .candidateControlDigest <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "trusted-control-digest=$(jq -r .trustedControlDigest <<<"$result")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          {
            registry: ghcr.io,
            username: '${{ github.actor }}',
            password: '${{ secrets.GITHUB_TOKEN }}',
          }
      - name: Derive the complete candidate QA image cache identity
        id: cache
        env:
          SNIPTALE_POLICY_ROOT: trusted-control
          SNIPTALE_IMAGE_KIND: qa
          SNIPTALE_FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || false }}
          SNIPTALE_FORCE_REBUILD_REASON: ${{ inputs.force_rebuild_reason || '' }}
        run: node trusted-control/tooling/ci/candidate-image-cache.mjs derive candidate "$RUNNER_TEMP/candidate-image/plan.json"
      - name: Resolve and verify the content-addressed candidate QA image
        id: cache-lookup
        run: node trusted-control/tooling/ci/candidate-image-cache.mjs lookup candidate "${{ steps.cache.outputs.plan }}"
      - name: Derive the complete trusted controller image cache identity
        id: controller-cache
        env:
          SNIPTALE_POLICY_ROOT: trusted-control
          SNIPTALE_IMAGE_KIND: controller
          SNIPTALE_FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || false }}
          SNIPTALE_FORCE_REBUILD_REASON: ${{ inputs.force_rebuild_reason || '' }}
        run: node trusted-control/tooling/ci/candidate-image-cache.mjs derive trusted-control "$RUNNER_TEMP/controller-image/plan.json"
      - name: Resolve and verify the content-addressed controller image
        id: controller-cache-lookup
        run: node trusted-control/tooling/ci/candidate-image-cache.mjs lookup trusted-control "${{ steps.controller-cache.outputs.plan }}"
      - name: Build exact candidate QA image
        id: build
        if: steps.cache-lookup.outputs['qa-build'] == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: candidate
          file: candidate/tooling/ci/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/lrozhkov/sniptale-qa:${{ steps.cache-lookup.outputs['qa-tag'] }}
          labels: |
            dev.sniptale.candidate-cache.schema=${{ steps.cache.outputs.cache-schema }}
            dev.sniptale.candidate-cache.key=${{ steps.cache.outputs.cache-key }}
            dev.sniptale.image-inputs=${{ steps.cache.outputs.image-input-digest }}
            dev.sniptale.platform=linux/amd64
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=sniptale-qa
          cache-to: ${{ github.event_name != 'pull_request_target' && env.QA_CACHE_EXPORT || '' }}
      - name: Build exact candidate controller image
        id: build-controller
        if: steps.controller-cache-lookup.outputs['controller-build'] == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: trusted-control
          file: trusted-control/tooling/ci/selectel/Dockerfile.controller
          platforms: linux/amd64
          push: true
          tags: ghcr.io/lrozhkov/sniptale-controller:${{ steps.controller-cache-lookup.outputs['controller-tag'] }}
          labels: |
            dev.sniptale.candidate-cache.schema=${{ steps.controller-cache.outputs.cache-schema }}
            dev.sniptale.candidate-cache.key=${{ steps.controller-cache.outputs.cache-key }}
            dev.sniptale.image-inputs=${{ steps.controller-cache.outputs.image-input-digest }}
            dev.sniptale.platform=linux/amd64
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=sniptale-controller
          cache-to: ${{ github.event_name != 'pull_request_target' && env.CONTROLLER_CACHE_EXPORT || '' }}
      - name: Bind exact image references
        id: reference
        env:
          QA_DIGEST: ${{ steps.build.outputs.digest || steps.cache-lookup.outputs['qa-digest'] }}
          CONTROLLER_DIGEST: ${{ steps.build-controller.outputs.digest || steps.controller-cache-lookup.outputs['controller-digest'] }}
        run: |
          printf '%s\n' "$QA_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
          printf '%s\n' "$CONTROLLER_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
          echo "reference=ghcr.io/lrozhkov/sniptale-qa@$QA_DIGEST" >> "$GITHUB_OUTPUT"
          echo "controller-reference=ghcr.io/lrozhkov/sniptale-controller@$CONTROLLER_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Verify immutable candidate binding and record seven-day liveness
        env:
          SNIPTALE_IMAGE_DIGEST: ${{ steps.build.outputs.digest || steps.cache-lookup.outputs['qa-digest'] }}
          SNIPTALE_IMAGE_TAG: ${{ steps.cache-lookup.outputs['qa-tag'] }}
        run: node trusted-control/tooling/ci/candidate-image-cache.mjs verify-receipt candidate "${{ steps.cache.outputs.plan }}"
      - name: Verify immutable controller binding and record seven-day liveness
        env:
          SNIPTALE_IMAGE_DIGEST: ${{ steps.build-controller.outputs.digest || steps.controller-cache-lookup.outputs['controller-digest'] }}
          SNIPTALE_IMAGE_TAG: ${{ steps.controller-cache-lookup.outputs['controller-tag'] }}
        run: node trusted-control/tooling/ci/candidate-image-cache.mjs verify-receipt trusted-control "${{ steps.controller-cache.outputs.plan }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-image-use-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate-image/use-receipt.json
            ${{ runner.temp }}/controller-image/use-receipt.json
          if-no-files-found: error
          retention-days: 9

  provision:
    needs: qa-image
    if: ${{ !cancelled() && needs.qa-image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: selectel-runner-controller
    outputs:
      has-record: ${{ steps.record.outputs.exists }}
      label: ${{ steps.record.outputs.label }}
      profile-index: ${{ steps.record.outputs.profile_index }}
      profiles-digest: ${{ steps.record.outputs.profiles_digest }}
      server-id: ${{ steps.record.outputs.server_id }}
      availability-zone: ${{ steps.record.outputs.availability_zone }}
      cpu-tokens: ${{ steps.record.outputs.cpu_tokens }}
      memory-mib: ${{ steps.record.outputs.memory_mib }}
      vitest-workers: ${{ steps.record.outputs.vitest_workers }}
      playwright-workers: ${{ steps.record.outputs.playwright_workers }}
      security-workers: ${{ steps.record.outputs.security_workers }}
      receipt_b64: ${{ steps.record.outputs.receipt_b64 }}
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TRUSTED_CONTROL_SHA }}', persist-credentials: false }
      - name: Provision first available disposable runner
        env:
          CONTROLLER_IMAGE: ${{ needs.qa-image.outputs.controller-reference }}
          SELECTEL_QA_PROFILES: ${{ vars.SELECTEL_QA_PROFILES }}
          SELECTEL_RELEASE_PROFILES: ${{ vars.SELECTEL_RELEASE_PROFILES }}
          SELECTEL_OS_AUTH_URL: ${{ vars.SELECTEL_OS_AUTH_URL }}
          SELECTEL_OS_REGION_NAME: ${{ vars.SELECTEL_OS_REGION_NAME }}
          SELECTEL_OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.SELECTEL_OS_APPLICATION_CREDENTIAL_ID }}
          SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET }}
          CONTROLLER_IMAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTROLLER_IMAGE_USER: ${{ github.actor }}
          RUNNER_CONTROLLER_TOKEN: ${{ secrets.RUNNER_CONTROLLER_TOKEN }}
          SNIPTALE_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          SNIPTALE_BASE_SHA: ${{ env.BASE_SHA }}
          SNIPTALE_TRUSTED_CONTROL_SHA: ${{ env.TRUSTED_CONTROL_SHA }}
          SNIPTALE_QA_IMAGE: ${{ needs.qa-image.outputs.reference }}
          SNIPTALE_PROOF_LANE: ${{ env.PROOF_LANE }}
        run: |
          selected_profiles="$SELECTEL_QA_PROFILES"
          if [ "$GATE_MODE" = release-provenance ]; then
            selected_profiles="$SELECTEL_RELEASE_PROFILES"
            if [ -z "$selected_profiles" ]; then
              echo 'SELECTEL_RELEASE_PROFILES is required for release provenance.' >&2
              exit 1
            fi
          fi
          anonymous_config="$RUNNER_TEMP/sniptale-anonymous-docker"
          mkdir -p "$anonymous_config"
          DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$SNIPTALE_QA_IMAGE" >/dev/null
          printf '%s' "$CONTROLLER_IMAGE_TOKEN" | docker login ghcr.io --username "$CONTROLLER_IMAGE_USER" --password-stdin >/dev/null
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --env SELECTEL_QA_PROFILES="$selected_profiles" \
            --env SELECTEL_OS_AUTH_URL --env SELECTEL_OS_REGION_NAME \
            --env SELECTEL_OS_APPLICATION_CREDENTIAL_ID --env SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET \
            --env RUNNER_CONTROLLER_TOKEN \
            --env SNIPTALE_CANDIDATE_SHA --env SNIPTALE_BASE_SHA --env SNIPTALE_TRUSTED_CONTROL_SHA \
            --env SNIPTALE_QA_IMAGE --env SNIPTALE_PROOF_LANE \
            --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT --env GITHUB_WORKFLOW \
            "$CONTROLLER_IMAGE" provision
      - name: Export sanitized selected profile
        id: record
        if: always()
        run: |
          record=build/selectel-controller/provision.json
          if [ ! -f "$record" ]; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if jq -e '
            (.runnerId != null or .serverId != null or (.portIds | length) > 0 or .securityGroupId != null or (.routerPortIds | length) > 0 or (.routerInterfacePortIds | length) > 0 or .routerId != null or .subnetId != null or .networkId != null or (.volumeIds | length) > 0) or
            any(.attempts[]?; .runnerId != null or .serverId != null or (.portIds | length) > 0 or .securityGroupId != null or (.routerPortIds | length) > 0 or (.routerInterfacePortIds | length) > 0 or .routerId != null or .subnetId != null or .networkId != null or (.volumeIds | length) > 0)
          ' "$record" >/dev/null; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "receipt_b64=$(base64 -w0 "$record")" >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
          if ! jq -e '.status == "online"' "$record" >/dev/null; then exit 0; fi
          for pair in label:runnerLabel profile_index:selectedProfileIndex profiles_digest:profilesDigest server_id:serverId availability_zone:availabilityZone cpu_tokens:resourceProfile.cpuTokens memory_mib:resourceProfile.memoryMiB vitest_workers:resourceProfile.vitestWorkers playwright_workers:resourceProfile.playwrightWorkers security_workers:resourceProfile.securityWorkers; do
            output=${pair%%:*}; field=${pair#*:}
            echo "$output=$(jq -er ".$field" "$record")" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: selectel-provision-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/selectel-controller/provision.json
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request_target' && 14 || 30 }}

  canonical-qa:
    needs: [qa-image, provision]
    if: >-
      !cancelled() &&
      needs.provision.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.gate != 'selectel-smoke')
    runs-on: ${{ fromJSON(format('["self-hosted","{0}"]', needs.provision.outputs.label)) }}
    timeout-minutes: 240
    permissions: { actions: read, contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            ref: '${{ env.TRUSTED_CONTROL_SHA }}',
            path: trusted-control,
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            ref: '${{ env.CANDIDATE_SHA }}',
            path: candidate,
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: ./trusted-control/.github/actions/setup-locked-node
        with: { repository-root: trusted-control }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: candidate/.tmp/npm-cache
          key: npm-${{ runner.os }}-${{ runner.arch }}-node-24.18.0-toolchain-${{ hashFiles('candidate/tooling/configs/ci/toolchain.lock.json') }}-lock-${{ hashFiles('candidate/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ runner.arch }}-node-24.18.0-toolchain-${{ hashFiles('candidate/tooling/configs/ci/toolchain.lock.json') }}-
      - name: Restore verified reusable proof inputs
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          source_sha="${BASE_SHA:-$TRUSTED_CONTROL_SHA}"
          build_root="$RUNNER_TEMP/base-fast-proof-${source_sha}"
          if (cd trusted-control && node tooling/ci/restore-fast-proof.mjs "$source_sha" "$build_root"); then
            build_proof="$build_root/.tmp/qa/build-proof.json"
            build_archive=$(find "$build_root/build" -maxdepth 1 -type f -name 'sniptale_*.zip' -print -quit)
            if [ -f "$build_proof" ] && [ -n "$build_archive" ]; then
              echo "SNIPTALE_BUILD_PROOF_PATH=$build_proof" >> "$GITHUB_ENV"
              echo "SNIPTALE_BUILD_ARCHIVE_PATH=$build_archive" >> "$GITHUB_ENV"
            fi
          fi
          if [ "$PROOF_LANE" = release ]; then
            codeql_root="$RUNNER_TEMP/release-codeql-proof"
            codeql_proof="$RUNNER_TEMP/codeql-proof.json"
            codeql_sarif="$RUNNER_TEMP/codeql-sarif.sarif"
            restored=$(cd trusted-control && node tooling/ci/select-codeql-proof.mjs restore-latest-release "$codeql_root" "$codeql_proof" "$codeql_sarif")
            if [ -n "$restored" ]; then
              echo "SNIPTALE_CODEQL_PROOF_PATH=$codeql_proof" >> "$GITHUB_ENV"
              echo "SNIPTALE_CODEQL_SARIF_PATH=$codeql_sarif" >> "$GITHUB_ENV"
            fi
            coverage_root="$RUNNER_TEMP/release-coverage-proof"
            coverage_proof="$RUNNER_TEMP/coverage-proof.json"
            coverage_reports="$RUNNER_TEMP/coverage-reports"
            restored=$(cd trusted-control && node tooling/ci/select-coverage-proof.mjs restore-latest-release "$coverage_root" "$coverage_proof" "$coverage_reports")
            if [ -n "$restored" ]; then
              echo "SNIPTALE_COVERAGE_PROOF_PATH=$coverage_proof" >> "$GITHUB_ENV"
              echo "SNIPTALE_COVERAGE_REPORTS_PATH=$coverage_reports" >> "$GITHUB_ENV"
            fi
            fast_root="$RUNNER_TEMP/fast-proof-${CANDIDATE_SHA}"
            if (cd trusted-control && node tooling/ci/restore-fast-proof.mjs "$CANDIDATE_SHA" "$fast_root"); then
              echo "SNIPTALE_FAST_PROOF_PATH=$fast_root" >> "$GITHUB_ENV"
            fi
          fi
      - name: Run exact canonical commit gate
        timeout-minutes: 225
        working-directory: candidate
        env:
          SNIPTALE_BASE_SHA: ${{ env.BASE_SHA }}
          SNIPTALE_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          SNIPTALE_TRUSTED_CONTROL_SHA: ${{ env.TRUSTED_CONTROL_SHA }}
          SNIPTALE_CI_IMAGE: ${{ needs.qa-image.outputs.reference }}
          SNIPTALE_CI_SKIP_BUILD: '1'
          SNIPTALE_SELECTEL_ATTEMPT: ${{ needs.provision.outputs.profile-index }}
          SNIPTALE_SELECTEL_PROFILES_DIGEST: ${{ needs.provision.outputs.profiles-digest }}
          SNIPTALE_SELECTEL_SERVER_ID: ${{ needs.provision.outputs.server-id }}
          SNIPTALE_SELECTEL_AVAILABILITY_ZONE: ${{ needs.provision.outputs.availability-zone }}
          SNIPTALE_QA_CPU_TOKENS: ${{ needs.provision.outputs.cpu-tokens }}
          SNIPTALE_QA_MEMORY_MIB: ${{ needs.provision.outputs.memory-mib }}
          SNIPTALE_QA_VITEST_MAX_WORKERS: ${{ needs.provision.outputs.vitest-workers }}
          SNIPTALE_QA_PLAYWRIGHT_WORKERS: ${{ needs.provision.outputs.playwright-workers }}
          SNIPTALE_QA_SECURITY_WORKERS: ${{ needs.provision.outputs.security-workers }}
        run: node ../trusted-control/tooling/ci/container.mjs "$PROOF_LANE"
      - name: Upload canonical proof before cleanup
        id: canonical-proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.PROOF_KIND }}-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/build/ci-artifacts/${{ env.PROOF_LANE }}-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: ${{ github.event_name == 'pull_request_target' && 14 || 30 }}
      - name: Upload incremental failure evidence when proof sealing did not complete
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-failure-evidence-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/.tmp/qa-observability/runs
            candidate/.tmp/qa-logs
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: ${{ github.event_name == 'pull_request_target' && 14 || 30 }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && github.event_name != 'pull_request_target'
        with:
          path: candidate/.tmp/npm-cache
          key: npm-${{ runner.os }}-${{ runner.arch }}-node-24.18.0-toolchain-${{ hashFiles('candidate/tooling/configs/ci/toolchain.lock.json') }}-lock-${{ hashFiles('candidate/package-lock.json') }}
      - name: Publish proof location and selected resources
        if: always()
        env:
          ARTIFACT_NAME: ${{ env.PROOF_KIND }}-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_URL: ${{ steps.canonical-proof.outputs.artifact-url }}
          BYPASS_REASON: ${{ inputs.bypass_reason || '' }}
        run: |
          manifest="candidate/build/ci-artifacts/${PROOF_LANE}-${CANDIDATE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/proof-manifest.json"
          failed_phase=bootstrap
          controls_changed=unknown
          control_disposition=unknown
          candidate_control_digest=unknown
          trusted_control_digest=unknown
          if [ -f "$manifest" ]; then
            failed_phase=$(jq -r '.phases[]? | select(.status == "failed") | .id' "$manifest" | head -n 1)
            controls_changed=$(jq -r '.controlsChanged // "unknown"' "$manifest")
            control_disposition=$(jq -r '.controlDisposition // "unknown"' "$manifest")
            candidate_control_digest=$(jq -r '.controlDigest // "unknown"' "$manifest")
            trusted_control_digest=$(jq -r '.trustedControlDigest // "unknown"' "$manifest")
          fi
          {
            echo "### ${PROOF_KIND}"
            echo
            echo "Candidate: $CANDIDATE_SHA"
            echo "QA controls changed: $controls_changed"
            echo "Control disposition: $control_disposition"
            echo "Candidate control digest: $candidate_control_digest"
            echo "Trusted control digest: $trusted_control_digest"
            echo "Resource profile: cpu=${{ needs.provision.outputs.cpu-tokens }}, memoryMiB=${{ needs.provision.outputs.memory-mib }}, vitest=${{ needs.provision.outputs.vitest-workers }}, playwright=${{ needs.provision.outputs.playwright-workers }}, security=${{ needs.provision.outputs.security-workers }}"
            echo "Failed phase: ${failed_phase:-none}"
            if [ -n "$BYPASS_REASON" ]; then echo "Operator note: $BYPASS_REASON"; fi
            if [ -n "$ARTIFACT_URL" ]; then
              echo "Artifact: [$ARTIFACT_NAME]($ARTIFACT_URL)"
              echo
              echo '```sh'
              echo "gh run download $GITHUB_RUN_ID -n $ARTIFACT_NAME"
              echo '```'
            else
              echo 'Artifact: not produced before the failure.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  advisory-artifacts:
    needs: canonical-qa
    if: >-
      always() &&
      needs.canonical-qa.result == 'success' &&
      (inputs.gate == 'fast' || inputs.gate == 'release-provenance')
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            ref: '${{ env.TRUSTED_CONTROL_SHA }}',
            path: trusted-control,
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            ref: '${{ env.CANDIDATE_SHA }}',
            path: candidate,
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: ./trusted-control/.github/actions/setup-locked-node
        with: { repository-root: trusted-control }
      - name: Install exact candidate dependencies
        working-directory: candidate
        run: npm ci --ignore-scripts
      - name: Collect report-only advisory evidence
        working-directory: candidate
        run: node tooling/ci/advisory-artifacts.mjs "$PROOF_LANE"
      - name: Upload report-only advisory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: advisory-evidence-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/.tmp/repo-audit
            candidate/.tmp/mutation
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: ${{ github.event_name == 'pull_request_target' && 14 || 30 }}

  infrastructure-smoke:
    needs: [qa-image, provision]
    if: >-
      !cancelled() &&
      needs.provision.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.gate == 'selectel-smoke'
    runs-on: ${{ fromJSON(format('["self-hosted","{0}"]', needs.provision.outputs.label)) }}
    timeout-minutes: 20
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TRUSTED_CONTROL_SHA }}', persist-credentials: false }
      - uses: ./.github/actions/setup-locked-node
      - name: Verify immutable QA image, locked tools, Chromium, and metadata isolation
        run: node tooling/ci/infrastructure-smoke.mjs '${{ needs.qa-image.outputs.reference }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        if: always()
        with:
          name: selectel-smoke-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/selectel-controller/infrastructure-smoke.json
          if-no-files-found: warn
          retention-days: 30

  trusted-admission:
    needs: [fast-classifier, qa-image, provision, canonical-qa]
    if: >-
      always() &&
      (needs.fast-classifier.outputs.reuse == 'true' || needs.canonical-qa.result == 'success') &&
      (github.event_name != 'workflow_dispatch' || (inputs.gate != 'selectel-connectivity' && inputs.gate != 'selectel-smoke'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      execution_path: ${{ steps.admit.outputs.execution_path }}
    permissions: { actions: read, contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            ref: '${{ env.TRUSTED_CONTROL_SHA }}',
            path: trusted-control,
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            ref: '${{ env.CANDIDATE_SHA }}',
            path: candidate,
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: ./trusted-control/.github/actions/setup-locked-node
        with: { repository-root: trusted-control }
      - name: Resolve the exact available proof producer attempt
        id: proof-artifact
        working-directory: trusted-control
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          prefix="${PROOF_KIND}-${CANDIDATE_SHA}-${GITHUB_RUN_ID}-"
          name=$(node tooling/ci/resolve-run-artifact.mjs "$GITHUB_RUN_ID" "$prefix")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0
        with:
          name: ${{ steps.proof-artifact.outputs.name }}
          path: candidate-proof
      - name: Admit candidate evidence with trusted-base policy
        id: admit
        working-directory: trusted-control
        env:
          QA_IMAGE: ${{ needs.qa-image.outputs.reference }}
          DERIVED: ${{ needs.fast-classifier.outputs.reuse }}
        run: |
          expected_digest=''
          execution_path=derived
          if [ "$DERIVED" != true ]; then
            execution_path=vm
            expected_digest="${QA_IMAGE##*@}"
          fi
          mkdir -p "$GITHUB_WORKSPACE/build/trusted-admission"
          node tooling/ci/admit-candidate-proof.mjs "$PROOF_LANE" \
            "$GITHUB_WORKSPACE/candidate-proof" "$GITHUB_WORKSPACE/candidate" \
            "$CANDIDATE_SHA" "$BASE_SHA" "$expected_digest" \
            "$TRUSTED_CONTROL_SHA" \
            > "$GITHUB_WORKSPACE/build/trusted-admission/admission.json"
          echo "execution_path=$execution_path" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: trusted-admission-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/trusted-admission/admission.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request_target' && 14 || 30 }}

  cleanup:
    needs: [qa-image, provision, canonical-qa, infrastructure-smoke]
    if: always() && needs.qa-image.result == 'success' && needs.provision.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: selectel-runner-controller
    permissions: { actions: read, contents: read, packages: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TRUSTED_CONTROL_SHA }}', persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          {
            name: 'selectel-provision-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}',
            path: controller,
          }
      - name: Restore the early provision receipt independently of artifact transport
        id: receipt
        env:
          PROVISION_RECEIPT_B64: ${{ needs.provision.outputs.receipt_b64 }}
        run: |
          mkdir -p controller
          if [ ! -f controller/provision.json ]; then
            if [ -n "$PROVISION_RECEIPT_B64" ]; then
              printf '%s' "$PROVISION_RECEIPT_B64" | base64 --decode > controller/provision.json
            else
              echo 'recovery=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Delete VM, volume, port, and JIT registration
        env:
          CONTROLLER_IMAGE: ${{ needs.qa-image.outputs.controller-reference }}
          SELECTEL_OS_AUTH_URL: ${{ vars.SELECTEL_OS_AUTH_URL }}
          SELECTEL_OS_REGION_NAME: ${{ vars.SELECTEL_OS_REGION_NAME }}
          SELECTEL_OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.SELECTEL_OS_APPLICATION_CREDENTIAL_ID }}
          SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET }}
          RUNNER_CONTROLLER_TOKEN: ${{ secrets.RUNNER_CONTROLLER_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null
          command=cleanup
          if [ ! -s controller/provision.json ]; then command=recover-cleanup; fi
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --env SELECTEL_OS_AUTH_URL --env SELECTEL_OS_REGION_NAME \
            --env SELECTEL_OS_APPLICATION_CREDENTIAL_ID --env SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET \
            --env RUNNER_CONTROLLER_TOKEN --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            "$CONTROLLER_IMAGE" "$command" /workspace/controller/provision.json
      - name: Report cleanup status
        if: always()
        run: |
          status=$(jq -r '.cleanup.status // .status // "unknown"' controller/provision.json 2>/dev/null || echo unknown)
          {
            echo '### Selectel cleanup'
            echo
            echo "Status: $status"
            echo "Candidate: $CANDIDATE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: selectel-cleanup-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: controller/provision.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request_target' && 14 || 30 }}

  security-results:
    needs: [canonical-qa, trusted-admission]
    if: >-
      !inputs.release_diagnostic &&
      needs.canonical-qa.result == 'success' &&
      needs.trusted-admission.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions: { actions: read, contents: read, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            ref: '${{ env.TRUSTED_CONTROL_SHA }}',
            path: trusted-control,
            persist-credentials: false,
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.CANDIDATE_SHA }}', path: candidate, persist-credentials: false }
      - uses: ./trusted-control/.github/actions/setup-locked-node
        with: { repository-root: trusted-control }
      - name: Resolve the exact available proof producer attempt
        id: proof-artifact
        working-directory: trusted-control
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          prefix="${PROOF_KIND}-${CANDIDATE_SHA}-${GITHUB_RUN_ID}-"
          name=$(node tooling/ci/resolve-run-artifact.mjs "$GITHUB_RUN_ID" "$prefix")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: { name: '${{ steps.proof-artifact.outputs.name }}', path: reports }
      - id: reports
        run: |
          echo "semgrep=$([ -f reports/.tmp/semgrep/results.sarif ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "codeql=$([ -f reports/.tmp/codeql/results.filtered.sarif ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: >-
          steps.reports.outputs.semgrep == 'true' &&
          (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          sarif_file: reports/.tmp/semgrep/results.sarif
          category: semgrep-canonical
          checkout_path: candidate
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          sha: ${{ env.CANDIDATE_SHA }}
      - if: >-
          steps.reports.outputs.codeql == 'true' &&
          (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          sarif_file: reports/.tmp/codeql/results.filtered.sarif
          category: codeql-canonical
          checkout_path: candidate
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          sha: ${{ env.CANDIDATE_SHA }}

  pr-gate:
    name: pr-gate
    needs: [fast-classifier, qa-image, provision, canonical-qa, trusted-admission, cleanup]
    if: >-
      always() &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'ci-local-proof-bypass')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TRUSTED_CONTROL_SHA }}', persist-credentials: false }
      - uses: ./.github/actions/setup-locked-node
      - name: Admit one exact trusted GitHub job graph
        env:
          SNIPTALE_ADMISSION_RESULT: ${{ needs.trusted-admission.result }}
          SNIPTALE_CANONICAL_RESULT: ${{ needs.canonical-qa.result }}
          SNIPTALE_CLASSIFIER_RESULT: ${{ needs.fast-classifier.result }}
          SNIPTALE_CLEANUP_RESULT: ${{ needs.cleanup.result }}
          SNIPTALE_DERIVED_REUSE: ${{ needs.fast-classifier.outputs.reuse }}
          SNIPTALE_EXECUTION_PATH: ${{ needs.trusted-admission.outputs.execution_path }}
          SNIPTALE_IMAGE_RESULT: ${{ needs.qa-image.result }}
          SNIPTALE_PROVISION_RESULT: ${{ needs.provision.result }}
        run: node tooling/ci/admit-gate-graph.mjs

  fast-gate:
    name: Fast PR Gate
    needs: [fast-classifier, qa-image, provision, canonical-qa, trusted-admission, cleanup]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.gate == 'fast'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TRUSTED_CONTROL_SHA }}', persist-credentials: false }
      - uses: ./.github/actions/setup-locked-node
      - env:
          SNIPTALE_ADMISSION_RESULT: ${{ needs.trusted-admission.result }}
          SNIPTALE_CANONICAL_RESULT: ${{ needs.canonical-qa.result }}
          SNIPTALE_CLASSIFIER_RESULT: ${{ needs.fast-classifier.result }}
          SNIPTALE_CLEANUP_RESULT: ${{ needs.cleanup.result }}
          SNIPTALE_DERIVED_REUSE: 'false'
          SNIPTALE_EXECUTION_PATH: ${{ needs.trusted-admission.outputs.execution_path }}
          SNIPTALE_IMAGE_RESULT: ${{ needs.qa-image.result }}
          SNIPTALE_PROVISION_RESULT: ${{ needs.provision.result }}
        run: node tooling/ci/admit-gate-graph.mjs

  release-provenance-gate:
    name: Release provenance Gate
    needs: [fast-classifier, qa-image, provision, canonical-qa, trusted-admission, cleanup]
    if: >-
      always() &&
      !inputs.release_diagnostic &&
      ((github.event_name == 'schedule' && github.event.schedule == '23 4 * * 1') ||
      (github.event_name == 'workflow_dispatch' && inputs.gate == 'release-provenance'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TRUSTED_CONTROL_SHA }}', persist-credentials: false }
      - uses: ./.github/actions/setup-locked-node
      - env:
          SNIPTALE_ADMISSION_RESULT: ${{ needs.trusted-admission.result }}
          SNIPTALE_CANONICAL_RESULT: ${{ needs.canonical-qa.result }}
          SNIPTALE_CLASSIFIER_RESULT: ${{ needs.fast-classifier.result }}
          SNIPTALE_CLEANUP_RESULT: ${{ needs.cleanup.result }}
          SNIPTALE_DERIVED_REUSE: 'false'
          SNIPTALE_EXECUTION_PATH: ${{ needs.trusted-admission.outputs.execution_path }}
          SNIPTALE_IMAGE_RESULT: ${{ needs.qa-image.result }}
          SNIPTALE_PROVISION_RESULT: ${{ needs.provision.result }}
        run: node tooling/ci/admit-gate-graph.mjs

  release-diagnostic-gate:
    name: Release diagnostic Gate
    needs: [fast-classifier, qa-image, provision, canonical-qa, trusted-admission, cleanup]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.gate == 'release-provenance' &&
      inputs.release_diagnostic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TRUSTED_CONTROL_SHA }}', persist-credentials: false }
      - uses: ./.github/actions/setup-locked-node
      - env:
          SNIPTALE_ADMISSION_RESULT: ${{ needs.trusted-admission.result }}
          SNIPTALE_CANONICAL_RESULT: ${{ needs.canonical-qa.result }}
          SNIPTALE_CLASSIFIER_RESULT: ${{ needs.fast-classifier.result }}
          SNIPTALE_CLEANUP_RESULT: ${{ needs.cleanup.result }}
          SNIPTALE_DERIVED_REUSE: 'false'
          SNIPTALE_EXECUTION_PATH: ${{ needs.trusted-admission.outputs.execution_path }}
          SNIPTALE_IMAGE_RESULT: ${{ needs.qa-image.result }}
          SNIPTALE_PROVISION_RESULT: ${{ needs.provision.result }}
        run: node tooling/ci/admit-gate-graph.mjs

  infrastructure-smoke-gate:
    name: Selectel infrastructure smoke
    needs: [qa-image, provision, infrastructure-smoke, cleanup]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.gate == 'selectel-smoke'
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful provisioning, smoke checks, and complete cleanup
        env:
          IMAGE_RESULT: ${{ needs.qa-image.result }}
          PROVISION_RESULT: ${{ needs.provision.result }}
          SMOKE_RESULT: ${{ needs.infrastructure-smoke.result }}
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
        run: |
          [ "$IMAGE_RESULT" = success ]
          [ "$PROVISION_RESULT" = success ]
          [ "$SMOKE_RESULT" = success ]
          [ "$CLEANUP_RESULT" = success ]
