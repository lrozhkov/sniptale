name: Release provenance
run-name: ${{ inputs.diagnostic && 'Release pipeline diagnostic' || 'Release provenance Gate' }}

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Build separate forced candidate images
        required: false
        default: false
        type: boolean
      force_rebuild_reason:
        description: Required audit reason for a forced rebuild
        required: false
        default: ''
        type: string
      diagnostic:
        description: Run the release QA graph on this branch without publication or attestation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-proof:
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.diagnostic)
    permissions:
      actions: read
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/_canonical-proof.yml
    secrets: inherit
    with:
      gate: release-provenance
      release_diagnostic: ${{ inputs.diagnostic || false }}
      force_rebuild: ${{ inputs.force_rebuild || false }}
      force_rebuild_reason: ${{ inputs.force_rebuild_reason || '' }}

  release-provenance-gate:
    name: Release provenance Gate
    needs: canonical-proof
    if: always() && github.ref == 'refs/heads/main' && !inputs.diagnostic
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require the exact canonical proof graph
        env:
          CANONICAL_PROOF_RESULT: ${{ needs.canonical-proof.result }}
        run: test "$CANONICAL_PROOF_RESULT" = success

  diagnostic-gate:
    name: Release pipeline diagnostic Gate
    needs: canonical-proof
    if: always() && github.event_name == 'workflow_dispatch' && inputs.diagnostic
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require the exact diagnostic proof graph
        env:
          CANONICAL_PROOF_RESULT: ${{ needs.canonical-proof.result }}
        run: test "$CANONICAL_PROOF_RESULT" = success

  coverage-results:
    needs: [canonical-proof, release-provenance-gate]
    if: needs.release-provenance-gate.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', persist-credentials: false }
      - uses: ./.github/actions/setup-locked-node
      - name: Download exact admitted release coverage
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          prefix="release-provenance-${GITHUB_SHA}-${GITHUB_RUN_ID}-"
          artifact_name=$(node tooling/ci/resolve-run-artifact.mjs "$GITHUB_RUN_ID" "$prefix")
          gh run download "$GITHUB_RUN_ID" --name "$artifact_name" --dir build/release-proof
          node tooling/ci/verify-main-proof.mjs release build/release-proof "$GITHUB_SHA"
      - name: Publish release provenance coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: build/release-proof/.tmp/coverage/canonical/lcov.info
          format: lcov
          git-branch: main
          git-commit: ${{ github.sha }}
          fail-on-error: true
          coverage-reporter-version: v0.6.22
