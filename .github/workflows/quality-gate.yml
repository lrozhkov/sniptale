          }
        run: |
          if [ "$PROVISION_RESULT" != success ] || [ ! -f attempt/attempt-2.json ]; then
            result='{"classification":"infrastructure-interruption","retry":true}'
          else
            result=$(node tooling/ci/selectel/adjudication.mjs attempt attempt/attempt-2.json "$CANDIDATE_SHA" "$QA_RESULT")
          fi
          echo "classification=$(jq -er .classification <<<"$result")" >> "$GITHUB_OUTPUT"
