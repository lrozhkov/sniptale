  canonical-qa:
    needs: [adjudicate-1, cleanup-1, adjudicate-2, cleanup-2, adjudicate-3, cleanup-3]
    if: always()
    runs-on: ubuntu-24.04
    permissions: { actions: read, contents: read }
    steps:
      - name: Select terminal attempt
        id: terminal
        env:
          ATTEMPT_1: ${{ needs.adjudicate-1.outputs.classification }}
          ATTEMPT_2: ${{ needs.adjudicate-2.outputs.classification }}
          ATTEMPT_3: ${{ needs.adjudicate-3.outputs.classification }}
        run: |
          for attempt in 1 2 3; do
            eval "classification=\$ATTEMPT_$attempt"
            if [ "$classification" = success ] || [ "$classification" = genuine-qa-failure ]; then
              echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
              echo "classification=$classification" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'classification=infrastructure-exhausted' >> "$GITHUB_OUTPUT"
      - name: Download terminal attempt proof
        if: steps.terminal.outputs.attempt != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          {
            name: 'canonical-attempt-${{ steps.terminal.outputs.attempt }}-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}',
            path: selected,
          }
      - name: Require a complete successful attempt
        env:
          CLASSIFICATION: ${{ steps.terminal.outputs.classification }}
          CLEANUP_1: ${{ needs.cleanup-1.result }}
          CLEANUP_2: ${{ needs.cleanup-2.result }}
          CLEANUP_3: ${{ needs.cleanup-3.result }}
        run: |
          test "$CLASSIFICATION" = success
          ! printf '%s\n' "$CLEANUP_1" "$CLEANUP_2" "$CLEANUP_3" | grep -Eq 'failure|cancelled'
      - name: Upload canonical proof
        id: canonical-proof
        if: always() && hashFiles('selected/proof-manifest.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-qa-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: selected
          if-no-files-found: error
          include-hidden-files: true
          retention-days: ${{ github.event_name == 'pull_request_target' && 14 || 30 }}
      - name: Publish canonical proof location
        if: always()
        env:
          ARTIFACT_NAME: canonical-qa-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.canonical-proof.outputs.artifact-url }}
          TERMINAL_ATTEMPT: ${{ steps.terminal.outputs.attempt }}
          CLASSIFICATION: ${{ steps.terminal.outputs.classification }}
          CLEANUP_1: ${{ needs.cleanup-1.result }}
          CLEANUP_2: ${{ needs.cleanup-2.result }}
          CLEANUP_3: ${{ needs.cleanup-3.result }}
        run: |
          server_id=$(jq -r '.infrastructure.serverId // "unavailable"' selected/proof-manifest.json 2>/dev/null || true)
          resource_profile=$(jq -c '.infrastructure.resourceProfile // {}' selected/proof-manifest.json 2>/dev/null || true)
          {
            echo '### Canonical QA proof'
            echo
            echo "Attempt: ${TERMINAL_ATTEMPT:-none}"
            echo "Classification: $CLASSIFICATION"
            echo "Selectel server: ${server_id:-unavailable}"
            echo "Resource profile: ${resource_profile:-unavailable}"
            echo "Cleanup: attempt-1=$CLEANUP_1, attempt-2=$CLEANUP_2, attempt-3=$CLEANUP_3"
            echo
            if [ -n "$ARTIFACT_URL" ]; then
              echo "Artifact: [$ARTIFACT_NAME]($ARTIFACT_URL)"
            else
              echo "Artifact upload did not produce a URL: $ARTIFACT_NAME"
            fi
            echo
            echo '```sh'
            echo "gh run download $GITHUB_RUN_ID -n $ARTIFACT_NAME"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  scheduled-sweeper:
    needs: qa-image
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: selectel-runner-controller
    permissions: { contents: read, packages: read }
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Delete expired managed Selectel resources
        env:
          CONTROLLER_IMAGE: ${{ needs.qa-image.outputs.controller-reference }}
          SELECTEL_OS_AUTH_URL: ${{ vars.SELECTEL_OS_AUTH_URL }}
          SELECTEL_OS_REGION_NAME: ${{ vars.SELECTEL_OS_REGION_NAME }}
          SELECTEL_OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.SELECTEL_OS_APPLICATION_CREDENTIAL_ID }}
          SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET }}
          RUNNER_CONTROLLER_TOKEN: ${{ secrets.RUNNER_CONTROLLER_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" \
            --env SELECTEL_OS_AUTH_URL --env SELECTEL_OS_REGION_NAME \
            --env SELECTEL_OS_APPLICATION_CREDENTIAL_ID --env SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET \
            --env RUNNER_CONTROLLER_TOKEN "$CONTROLLER_IMAGE" sweep
      - name: Upload sanitized sweep proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selectel-sweep-${{ github.sha }}-${{ github.run_id }}
          path: build/selectel-controller/sweep.json
          if-no-files-found: error
          retention-days: 30

  security-results:
    needs: canonical-qa
    if: needs.canonical-qa.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    steps:
      - name: Download canonical security reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: 'canonical-qa-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}', path: reports }
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@988661ebb5e81487b3fb31b2185d2856c0a10679
        with: { sarif_file: reports/.tmp/semgrep/results.sarif, category: semgrep-canonical }
      - name: Upload baseline-filtered CodeQL SARIF
        uses: github/codeql-action/upload-sarif@988661ebb5e81487b3fb31b2185d2856c0a10679
        with: { sarif_file: reports/.tmp/codeql/results.filtered.sarif, category: codeql-canonical }

  coverage-results:
    needs: canonical-qa
    if: needs.canonical-qa.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Download canonical coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: 'canonical-qa-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}', path: reports }
      - name: Publish coverage display
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f
        with:
          files: reports/.tmp/coverage/canonical/lcov.info
          use_oidc: true
          fail_ci_if_error: false
          verbose: false

  publish-qa-image:
    needs: [canonical-qa, qa-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.canonical-qa.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Sign in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          {
            registry: ghcr.io,
            username: '${{ github.actor }}',
            password: '${{ secrets.GITHUB_TOKEN }}',
          }
      - name: Refuse immutable tag replacement
        env:
          IMMUTABLE_IMAGE: ghcr.io/lrozhkov/sniptale-qa:sha-${{ github.sha }}
          IMMUTABLE_CONTROLLER: ghcr.io/lrozhkov/sniptale-controller:sha-${{ github.sha }}
        run: |
          for image in "$IMMUTABLE_IMAGE" "$IMMUTABLE_CONTROLLER"; do
            lookup_error=$(mktemp)
            if docker buildx imagetools inspect "$image" >/dev/null 2>"$lookup_error"; then
              echo "Refusing to replace existing immutable image tag: $image" >&2
              exit 1
            elif ! grep -Eqi '(^|: )(manifest unknown|not found)(:|$)' "$lookup_error"; then
              cat "$lookup_error" >&2
              echo "Unable to prove immutable image tag absence" >&2
              exit 1
            fi
          done
      - name: Publish immutable and moving image tags
        id: publish-image
        env: { SOURCE_IMAGE: '${{ needs.qa-image.outputs.reference }}' }
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/lrozhkov/sniptale-qa:sha-${GITHUB_SHA}" \
            --tag 'ghcr.io/lrozhkov/sniptale-qa:main' \
            "$SOURCE_IMAGE"
          digest=${SOURCE_IMAGE##*@}
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Publish immutable controller image tags
        env: { SOURCE_IMAGE: '${{ needs.qa-image.outputs.controller-reference }}' }
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/lrozhkov/sniptale-controller:sha-${GITHUB_SHA}" \
            --tag 'ghcr.io/lrozhkov/sniptale-controller:main' \
            "$SOURCE_IMAGE"
      - name: Record exact published image digest
        env:
          PUBLISHED_DIGEST: ${{ steps.publish-image.outputs.digest }}
        run: node tooling/ci/image-proof.mjs write build/qa-image-proof "$GITHUB_SHA" "$GITHUB_RUN_ID" "$PUBLISHED_DIGEST"
      - name: Upload exact image proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa-image-proof-${{ github.sha }}-${{ github.run_id }}
          path: build/qa-image-proof
          if-no-files-found: error
          retention-days: 30

  pr-gate:
    name: pr-gate-authority
    needs: canonical-qa
    if: >-
      always() &&
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.selectel_connectivity_only != true)
    runs-on: ubuntu-24.04
    permissions:
      checks: write
    steps:
      - name: Publish candidate-bound required check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANONICAL_RESULT: ${{ needs.canonical-qa.result }}
        run: |
          conclusion=failure
          if [ "$CANONICAL_RESULT" = success ]; then
            conclusion=success
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name=pr-gate \
            -f head_sha="$CANDIDATE_SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f output[title]="Canonical QA gate: $conclusion" \
            -f output[summary]="canonical-qa=$CANONICAL_RESULT" \
            >/dev/null
          test "$conclusion" = success
