  adjudicate-2:
    needs: [provision-2, canonical-qa-2]
    if: always() && needs.provision-2.result != 'skipped'
    runs-on: ubuntu-24.04
    outputs:
      classification: ${{ steps.result.outputs.classification }}
      retry: ${{ steps.result.outputs.retry }}
    permissions: { actions: read, contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TRUSTED_CONTROL_SHA }}', persist-credentials: false }
      - if: needs.provision-2.outputs.has-record == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          {
            pattern: '*-attempt-2-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}',
