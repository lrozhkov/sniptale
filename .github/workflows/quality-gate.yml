          }
        run: |
          if [ "$PROVISION_RESULT" != success ] || [ ! -f attempt/attempt-3.json ]; then
            result='{"classification":"infrastructure-interruption","retry":true}'
          else
            result=$(node tooling/ci/selectel/adjudication.mjs attempt attempt/attempt-3.json "$CANDIDATE_SHA" "$QA_RESULT")
          fi
          echo "classification=$(jq -er .classification <<<"$result")" >> "$GITHUB_OUTPUT"

  cleanup-3:
    needs: [qa-image, provision-3, canonical-qa-3]
    if: always() && needs.provision-3.outputs.has-record == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: selectel-runner-controller
    permissions: { actions: read, contents: read, packages: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TRUSTED_CONTROL_SHA }}', persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
