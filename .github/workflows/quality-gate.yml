          SNIPTALE_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          SNIPTALE_TRUSTED_CI_ROOT: ${{ github.workspace }}/trusted-control
          SNIPTALE_TRUSTED_CONTROL_SHA: ${{ env.TRUSTED_CONTROL_SHA }}
          SNIPTALE_CI_IMAGE: ${{ needs.qa-image.outputs.reference }}
          SNIPTALE_CI_SKIP_BUILD: '1'
          SNIPTALE_SELECTEL_ATTEMPT: '3'
          SNIPTALE_SELECTEL_SERVER_ID: ${{ needs.provision-3.outputs.server-id }}
          SNIPTALE_SELECTEL_AVAILABILITY_ZONE: ${{ needs.provision-3.outputs.availability-zone }}
        run: node ../trusted-control/tooling/ci/container.mjs candidate
      - name: Build informational candidate controls on the disposable runner
        if: always() && github.event_name == 'pull_request_target'
        continue-on-error: true
        working-directory: candidate
        env: { SNIPTALE_ATTEMPT: '3' }
        run: |
          pattern='^(\.github/workflows/|tooling/(ci|qa)/|tooling/configs/(ci|qa)/|package(-lock)?\.json$)'
          if ! git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | grep -Eq "$pattern"; then exit 0; fi
          image="sniptale-candidate-control:${CANDIDATE_SHA}"
          docker build --platform linux/amd64 --file tooling/ci/Dockerfile --tag "$image" .
          digest=$(docker image inspect --format='{{.Id}}' "$image")
          printf '%s\n' "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
          jq -n --arg candidateSha "$CANDIDATE_SHA" --arg baseSha "$BASE_SHA" \
            --arg imageDigest "$digest" --argjson attempt "$SNIPTALE_ATTEMPT" \
            '{schemaVersion: 1, informational: true, candidateSha: $candidateSha, baseSha: $baseSha, imageDigest: $imageDigest, attempt: $attempt}' \
            > build/candidate-control-proof.json
      - name: Upload informational candidate control proof
        if: always() && hashFiles('candidate/build/candidate-control-proof.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-control-3-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: candidate/build/candidate-control-proof.json
          if-no-files-found: error
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-attempt-3-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: candidate/build/ci-artifacts/candidate-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: ${{ github.event_name == 'pull_request_target' && 14 || 30 }}

  adjudicate-3:
    needs: [provision-3, canonical-qa-3]
    if: always() && needs.provision-3.result != 'skipped'
    runs-on: ubuntu-24.04
    outputs:
      classification: ${{ steps.result.outputs.classification }}
    permissions: { actions: read, contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TRUSTED_CONTROL_SHA }}', persist-credentials: false }
      - if: needs.provision-3.outputs.has-record == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          {
            pattern: '*-attempt-3-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}',
            path: attempt,
            merge-multiple: true,
          }
      - id: result
        env:
          {
            PROVISION_RESULT: '${{ needs.provision-3.result }}',
