  provision-3:
    needs: [qa-image, adjudicate-2, cleanup-2]
    if: >-
      always() && needs.adjudicate-2.outputs.retry == 'true' &&
      (needs.cleanup-2.result == 'success' || needs.cleanup-2.result == 'skipped')
