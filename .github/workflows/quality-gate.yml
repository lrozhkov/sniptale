name: Quality gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      selectel_connectivity_only:
        description: Validate Selectel auth, catalog, profiles, image, flavor, and network APIs without writes
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  TRUSTED_CONTROL_SHA: ${{ github.event.pull_request.base.sha || github.sha }}

jobs:
  selectel-controller-preflight:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.selectel_connectivity_only == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: selectel-runner-controller
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', persist-credentials: false }
      - run: docker build --file tooling/ci/selectel/Dockerfile.controller --tag sniptale-controller:preflight .
      - name: Validate Selectel connectivity and runtime profiles without writes
        env:
          SELECTEL_OS_AUTH_URL: ${{ vars.SELECTEL_OS_AUTH_URL }}
          SELECTEL_OS_REGION_NAME: ${{ vars.SELECTEL_OS_REGION_NAME }}
          SELECTEL_QA_PROFILES: ${{ vars.SELECTEL_QA_PROFILES }}
          SELECTEL_OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.SELECTEL_OS_APPLICATION_CREDENTIAL_ID }}
          SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET }}
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" \
            --env SELECTEL_OS_AUTH_URL --env SELECTEL_OS_REGION_NAME --env SELECTEL_QA_PROFILES \
            --env SELECTEL_OS_APPLICATION_CREDENTIAL_ID --env SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET \
            sniptale-controller:preflight preflight
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: selectel-connectivity-${{ github.sha }}-${{ github.run_id }}
          path: build/selectel-controller/preflight.json
          if-no-files-found: error
          retention-days: 30

  qa-image:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.selectel_connectivity_only != true) &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      reference: ${{ steps.reference.outputs.reference }}
      controller-reference: ${{ steps.reference.outputs.controller-reference }}
    permissions: { contents: read, packages: write }
    steps:
      - name: Check out trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TRUSTED_CONTROL_SHA }}', persist-credentials: false }
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          {
            registry: ghcr.io,
            username: '${{ github.actor }}',
            password: '${{ secrets.GITHUB_TOKEN }}',
          }
      - name: Resolve immutable trusted images
        id: resolve
        if: github.event_name == 'pull_request_target' || github.event_name == 'schedule'
        run: |
          for kind in qa controller; do
            repository=sniptale-$kind
            if [ "$kind" = qa ]; then repository=sniptale-qa; fi
            digest=$(docker buildx imagetools inspect "ghcr.io/lrozhkov/${repository}:sha-${TRUSTED_CONTROL_SHA}" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)
            printf '%s\n' "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
            echo "${kind}-digest=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Build trusted QA image
        id: build
        if: github.event_name != 'pull_request_target' && github.event_name != 'schedule'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: tooling/ci/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/lrozhkov/sniptale-qa:candidate-${{ env.TRUSTED_CONTROL_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ env.TRUSTED_CONTROL_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=sniptale-qa
          cache-to: type=gha,mode=max,scope=sniptale-qa
      - name: Build trusted controller image
        id: build-controller
        if: github.event_name != 'pull_request_target' && github.event_name != 'schedule'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: tooling/ci/selectel/Dockerfile.controller
          platforms: linux/amd64
          push: true
          tags: ghcr.io/lrozhkov/sniptale-controller:candidate-${{ env.TRUSTED_CONTROL_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ env.TRUSTED_CONTROL_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=sniptale-controller
          cache-to: type=gha,mode=max,scope=sniptale-controller
      - name: Bind exact image references
        id: reference
        env:
          QA_DIGEST: ${{ steps.build.outputs.digest || steps.resolve.outputs['qa-digest'] }}
          CONTROLLER_DIGEST: ${{ steps.build-controller.outputs.digest || steps.resolve.outputs['controller-digest'] }}
        run: |
          printf '%s\n' "$QA_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
          printf '%s\n' "$CONTROLLER_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
          echo "reference=ghcr.io/lrozhkov/sniptale-qa@$QA_DIGEST" >> "$GITHUB_OUTPUT"
          echo "controller-reference=ghcr.io/lrozhkov/sniptale-controller@$CONTROLLER_DIGEST" >> "$GITHUB_OUTPUT"

  provision:
    needs: qa-image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: selectel-runner-controller
    outputs:
      has-record: ${{ steps.record.outputs.exists }}
      label: ${{ steps.record.outputs.label }}
      profile-index: ${{ steps.record.outputs.profile_index }}
      profiles-digest: ${{ steps.record.outputs.profiles_digest }}
      server-id: ${{ steps.record.outputs.server_id }}
      availability-zone: ${{ steps.record.outputs.availability_zone }}
      cpu-tokens: ${{ steps.record.outputs.cpu_tokens }}
      memory-mib: ${{ steps.record.outputs.memory_mib }}
      vitest-workers: ${{ steps.record.outputs.vitest_workers }}
      playwright-workers: ${{ steps.record.outputs.playwright_workers }}
      security-workers: ${{ steps.record.outputs.security_workers }}
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TRUSTED_CONTROL_SHA }}', persist-credentials: false }
      - name: Provision first available disposable runner
        env:
          CONTROLLER_IMAGE: ${{ needs.qa-image.outputs.controller-reference }}
          SELECTEL_QA_PROFILES: ${{ vars.SELECTEL_QA_PROFILES }}
          SELECTEL_OS_AUTH_URL: ${{ vars.SELECTEL_OS_AUTH_URL }}
          SELECTEL_OS_REGION_NAME: ${{ vars.SELECTEL_OS_REGION_NAME }}
          SELECTEL_OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.SELECTEL_OS_APPLICATION_CREDENTIAL_ID }}
          SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET }}
          RUNNER_CONTROLLER_TOKEN: ${{ secrets.RUNNER_CONTROLLER_TOKEN }}
          RUNNER_IMAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_IMAGE_USER: ${{ github.actor }}
          SNIPTALE_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          SNIPTALE_BASE_SHA: ${{ env.BASE_SHA }}
          SNIPTALE_TRUSTED_CONTROL_SHA: ${{ env.TRUSTED_CONTROL_SHA }}
          SNIPTALE_QA_IMAGE: ${{ needs.qa-image.outputs.reference }}
        run: |
          printf '%s' "$RUNNER_IMAGE_TOKEN" | docker login ghcr.io --username "$RUNNER_IMAGE_USER" --password-stdin >/dev/null
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" \
            --env SELECTEL_QA_PROFILES --env SELECTEL_OS_AUTH_URL --env SELECTEL_OS_REGION_NAME \
            --env SELECTEL_OS_APPLICATION_CREDENTIAL_ID --env SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET \
            --env RUNNER_CONTROLLER_TOKEN --env RUNNER_IMAGE_TOKEN --env RUNNER_IMAGE_USER \
            --env SNIPTALE_CANDIDATE_SHA --env SNIPTALE_BASE_SHA --env SNIPTALE_TRUSTED_CONTROL_SHA \
            --env SNIPTALE_QA_IMAGE --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT --env GITHUB_WORKFLOW \
            "$CONTROLLER_IMAGE" provision
      - name: Export sanitized selected profile
        id: record
        if: always()
        run: |
          record=build/selectel-controller/provision.json
          if [ ! -f "$record" ] || ! jq -e '.status == "online"' "$record" >/dev/null; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'exists=true' >> "$GITHUB_OUTPUT"
          for pair in label:runnerLabel profile_index:selectedProfileIndex profiles_digest:profilesDigest server_id:serverId availability_zone:availabilityZone cpu_tokens:resourceProfile.cpuTokens memory_mib:resourceProfile.memoryMiB vitest_workers:resourceProfile.vitestWorkers playwright_workers:resourceProfile.playwrightWorkers security_workers:resourceProfile.securityWorkers; do
            output=${pair%%:*}; field=${pair#*:}
            echo "$output=$(jq -er ".$field" "$record")" >> "$GITHUB_OUTPUT"
          done
      - name: Preserve sanitized controller record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: selectel-provision-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: build/selectel-controller/provision.json
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request_target' && 14 || 30 }}

  canonical-qa:
    needs: [qa-image, provision]
    if: needs.provision.result == 'success'
    runs-on: ${{ fromJSON(format('["self-hosted","{0}"]', needs.provision.outputs.label)) }}
    timeout-minutes: 180
    permissions: { actions: read, contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            ref: '${{ env.TRUSTED_CONTROL_SHA }}',
            path: trusted-control,
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            ref: '${{ env.CANDIDATE_SHA }}',
            path: candidate,
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          { node-version: 22.12.0, cache: npm, cache-dependency-path: candidate/package-lock.json }
      - name: Restore verified main receipts when available
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          source_sha="${BASE_SHA:-$TRUSTED_CONTROL_SHA}"
          proof_root="$RUNNER_TEMP/main-proof-${source_sha}"
          unit_proof="$RUNNER_TEMP/unit-proof-${source_sha}.json"
          restored=$(cd trusted-control && node tooling/ci/select-unit-proof.mjs restore "$source_sha" "$proof_root" "$unit_proof")
          if [ -n "$restored" ]; then echo "SNIPTALE_UNIT_PROOF_PATH=$unit_proof" >> "$GITHUB_ENV"; fi
          codeql_root="$RUNNER_TEMP/main-codeql-proof-${source_sha}"
          codeql_proof="$RUNNER_TEMP/codeql-proof-${source_sha}.json"
          codeql_sarif="$RUNNER_TEMP/codeql-sarif-${source_sha}.sarif"
          restored=$(cd trusted-control && node tooling/ci/select-codeql-proof.mjs restore "$source_sha" "$codeql_root" "$codeql_proof" "$codeql_sarif")
          if [ -n "$restored" ]; then
            echo "SNIPTALE_CODEQL_PROOF_PATH=$codeql_proof" >> "$GITHUB_ENV"
            echo "SNIPTALE_CODEQL_SARIF_PATH=$codeql_sarif" >> "$GITHUB_ENV"
          fi
          coverage_root="$RUNNER_TEMP/main-coverage-proof-${source_sha}"
          coverage_proof="$RUNNER_TEMP/coverage-proof-${source_sha}.json"
          coverage_reports="$RUNNER_TEMP/coverage-reports-${source_sha}"
          restored=$(cd trusted-control && node tooling/ci/select-coverage-proof.mjs restore "$source_sha" "$coverage_root" "$coverage_proof" "$coverage_reports")
          if [ -n "$restored" ]; then
            echo "SNIPTALE_COVERAGE_PROOF_PATH=$coverage_proof" >> "$GITHUB_ENV"
            echo "SNIPTALE_COVERAGE_REPORTS_PATH=$coverage_reports" >> "$GITHUB_ENV"
          fi
      - name: Run canonical local wrappers
        working-directory: candidate
        env:
          SNIPTALE_BASE_SHA: ${{ env.BASE_SHA }}
          SNIPTALE_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          SNIPTALE_TRUSTED_CI_ROOT: ${{ github.workspace }}/trusted-control
          SNIPTALE_TRUSTED_CONTROL_SHA: ${{ env.TRUSTED_CONTROL_SHA }}
          SNIPTALE_CI_IMAGE: ${{ needs.qa-image.outputs.reference }}
          SNIPTALE_CI_SKIP_BUILD: '1'
          SNIPTALE_CI_HEAVY_AUDIT: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
          SNIPTALE_SELECTEL_ATTEMPT: ${{ needs.provision.outputs.profile-index }}
          SNIPTALE_SELECTEL_PROFILES_DIGEST: ${{ needs.provision.outputs.profiles-digest }}
          SNIPTALE_SELECTEL_SERVER_ID: ${{ needs.provision.outputs.server-id }}
          SNIPTALE_SELECTEL_AVAILABILITY_ZONE: ${{ needs.provision.outputs.availability-zone }}
          SNIPTALE_QA_CPU_TOKENS: ${{ needs.provision.outputs.cpu-tokens }}
          SNIPTALE_QA_MEMORY_MIB: ${{ needs.provision.outputs.memory-mib }}
          SNIPTALE_QA_VITEST_MAX_WORKERS: ${{ needs.provision.outputs.vitest-workers }}
          SNIPTALE_QA_PLAYWRIGHT_WORKERS: ${{ needs.provision.outputs.playwright-workers }}
          SNIPTALE_QA_SECURITY_WORKERS: ${{ needs.provision.outputs.security-workers }}
        run: node ../trusted-control/tooling/ci/container.mjs candidate
      - name: Build informational candidate controls
        if: always() && github.event_name == 'pull_request_target'
        continue-on-error: true
        working-directory: candidate
        run: |
          pattern='^(\.github/workflows/|tooling/(ci|qa)/|tooling/configs/(ci|qa)/|package(-lock)?\.json$)'
          if ! git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | grep -Eq "$pattern"; then exit 0; fi
          image="sniptale-candidate-control:${CANDIDATE_SHA}"
          docker build --platform linux/amd64 --file tooling/ci/Dockerfile --tag "$image" .
          digest=$(docker image inspect --format='{{.Id}}' "$image")
          jq -n --arg candidateSha "$CANDIDATE_SHA" --arg baseSha "$BASE_SHA" --arg imageDigest "$digest" \
            '{schemaVersion: 1, informational: true, candidateSha: $candidateSha, baseSha: $baseSha, imageDigest: $imageDigest}' \
            > build/candidate-control-proof.json
      - name: Upload canonical proof before cleanup
        id: canonical-proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-qa-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: candidate/build/ci-artifacts/candidate-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: ${{ github.event_name == 'pull_request_target' && 14 || 30 }}
      - name: Upload informational candidate control proof
        if: always() && hashFiles('candidate/build/candidate-control-proof.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-control-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: candidate/build/candidate-control-proof.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish proof location and selected resources
        if: always()
        env:
          ARTIFACT_NAME: canonical-qa-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.canonical-proof.outputs.artifact-url }}
          PROFILE_INDEX: ${{ needs.provision.outputs.profile-index }}
          PROFILES_DIGEST: ${{ needs.provision.outputs.profiles-digest }}
        run: |
          failed_phase=$(jq -r '.phases[]? | select(.status == "failed") | .id' candidate/build/ci-artifacts/candidate-${CANDIDATE_SHA}-${GITHUB_RUN_ID}/proof-manifest.json 2>/dev/null | head -n 1)
          {
            echo '### Canonical QA proof'
            echo
            echo "Selected profile index: $PROFILE_INDEX"
            echo "Profiles digest: $PROFILES_DIGEST"
            echo "Resource profile: cpu=${{ needs.provision.outputs.cpu-tokens }}, memoryMiB=${{ needs.provision.outputs.memory-mib }}, vitest=${{ needs.provision.outputs.vitest-workers }}, playwright=${{ needs.provision.outputs.playwright-workers }}, security=${{ needs.provision.outputs.security-workers }}"
            echo "Failed phase: ${failed_phase:-none}"
            echo "Artifact: [$ARTIFACT_NAME]($ARTIFACT_URL)"
            echo
            echo '```sh'
            echo "gh run download $GITHUB_RUN_ID -n $ARTIFACT_NAME"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    needs: [qa-image, provision, canonical-qa]
    if: always() && needs.provision.outputs.has-record == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: selectel-runner-controller
    permissions: { actions: read, contents: read, packages: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TRUSTED_CONTROL_SHA }}', persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          {
            name: 'selectel-provision-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}',
            path: controller,
          }
      - name: Delete VM, volume, port, and JIT registration
        env:
          CONTROLLER_IMAGE: ${{ needs.qa-image.outputs.controller-reference }}
          SELECTEL_OS_AUTH_URL: ${{ vars.SELECTEL_OS_AUTH_URL }}
          SELECTEL_OS_REGION_NAME: ${{ vars.SELECTEL_OS_REGION_NAME }}
          SELECTEL_OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.SELECTEL_OS_APPLICATION_CREDENTIAL_ID }}
          SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET }}
          RUNNER_CONTROLLER_TOKEN: ${{ secrets.RUNNER_CONTROLLER_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" \
            --env SELECTEL_OS_AUTH_URL --env SELECTEL_OS_REGION_NAME \
            --env SELECTEL_OS_APPLICATION_CREDENTIAL_ID --env SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET \
            --env RUNNER_CONTROLLER_TOKEN "$CONTROLLER_IMAGE" cleanup /workspace/controller/provision.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: selectel-cleanup-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: controller/provision.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request_target' && 14 || 30 }}

  scheduled-sweeper:
    needs: qa-image
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: selectel-runner-controller
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Delete expired managed Selectel resources
        env:
          CONTROLLER_IMAGE: ${{ needs.qa-image.outputs.controller-reference }}
          SELECTEL_OS_AUTH_URL: ${{ vars.SELECTEL_OS_AUTH_URL }}
          SELECTEL_OS_REGION_NAME: ${{ vars.SELECTEL_OS_REGION_NAME }}
          SELECTEL_OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.SELECTEL_OS_APPLICATION_CREDENTIAL_ID }}
          SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET }}
          RUNNER_CONTROLLER_TOKEN: ${{ secrets.RUNNER_CONTROLLER_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" \
            --env SELECTEL_OS_AUTH_URL --env SELECTEL_OS_REGION_NAME \
            --env SELECTEL_OS_APPLICATION_CREDENTIAL_ID --env SELECTEL_OS_APPLICATION_CREDENTIAL_SECRET \
            --env RUNNER_CONTROLLER_TOKEN "$CONTROLLER_IMAGE" sweep
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: selectel-sweep-${{ github.sha }}-${{ github.run_id }}
          path: build/selectel-controller/sweep.json
          if-no-files-found: error
          retention-days: 30

  security-results:
    needs: canonical-qa
    if: needs.canonical-qa.result == 'success'
    runs-on: ubuntu-24.04
    permissions: { security-events: write }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: { name: 'canonical-qa-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}', path: reports }
      - name: Detect available SARIF reports
        id: reports
        run: |
          echo "semgrep=$([ -f reports/.tmp/semgrep/results.sarif ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "codeql=$([ -f reports/.tmp/codeql/results.filtered.sarif ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.reports.outputs.semgrep == 'true'
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with: { sarif_file: reports/.tmp/semgrep/results.sarif, category: semgrep-canonical }
      - if: steps.reports.outputs.codeql == 'true'
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with: { sarif_file: reports/.tmp/codeql/results.filtered.sarif, category: codeql-canonical }

  coverage-results:
    needs: canonical-qa
    if: >-
      needs.canonical-qa.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: { name: 'canonical-qa-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}', path: reports }
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: reports/.tmp/coverage/canonical/lcov.info
          use_oidc: true
          fail_ci_if_error: false
          verbose: false

  publish-qa-image:
    needs: [canonical-qa, cleanup, qa-image]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.canonical-qa.result == 'success' && needs.cleanup.result == 'success'
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          {
            registry: ghcr.io,
            username: '${{ github.actor }}',
            password: '${{ secrets.GITHUB_TOKEN }}',
          }
      - name: Refuse immutable tag replacement
        run: |
          for image in "ghcr.io/lrozhkov/sniptale-qa:sha-${GITHUB_SHA}" "ghcr.io/lrozhkov/sniptale-controller:sha-${GITHUB_SHA}"; do
            lookup_error=$(mktemp)
            if docker buildx imagetools inspect "$image" >/dev/null 2>"$lookup_error"; then
              echo "Refusing to replace existing immutable image tag: $image" >&2; exit 1
            elif ! grep -Eqi '(^|: )(manifest unknown|not found)(:|$)' "$lookup_error"; then
              cat "$lookup_error" >&2; echo 'Unable to prove immutable image tag absence' >&2; exit 1
            fi
          done
      - name: Publish immutable and moving tags
        id: publish-image
        env:
          QA_SOURCE: ${{ needs.qa-image.outputs.reference }}
          CONTROLLER_SOURCE: ${{ needs.qa-image.outputs.controller-reference }}
        run: |
          docker buildx imagetools create --tag "ghcr.io/lrozhkov/sniptale-qa:sha-${GITHUB_SHA}" --tag ghcr.io/lrozhkov/sniptale-qa:main "$QA_SOURCE"
          docker buildx imagetools create --tag "ghcr.io/lrozhkov/sniptale-controller:sha-${GITHUB_SHA}" --tag ghcr.io/lrozhkov/sniptale-controller:main "$CONTROLLER_SOURCE"
          echo "digest=${QA_SOURCE##*@}" >> "$GITHUB_OUTPUT"
      - run: node tooling/ci/image-proof.mjs write build/qa-image-proof "$GITHUB_SHA" "$GITHUB_RUN_ID" "${{ steps.publish-image.outputs.digest }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qa-image-proof-${{ github.sha }}-${{ github.run_id }}
          path: build/qa-image-proof
          if-no-files-found: error
          retention-days: 30

  pr-gate:
    name: pr-gate-authority
    needs: [canonical-qa, cleanup]
    if: >-
      always() && github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.selectel_connectivity_only != true)
    runs-on: ubuntu-24.04
    permissions: { checks: write }
    steps:
      - name: Publish candidate-bound required check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANONICAL_RESULT: ${{ needs.canonical-qa.result }}
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
        run: |
          conclusion=failure
          if [ "$CANONICAL_RESULT" = success ] && [ "$CLEANUP_RESULT" = success ]; then conclusion=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name=pr-gate -f head_sha="$CANDIDATE_SHA" -f status=completed -f conclusion="$conclusion" \
            -f output[title]="Canonical QA gate: $conclusion" \
            -f output[summary]="canonical-qa=$CANONICAL_RESULT cleanup=$CLEANUP_RESULT" >/dev/null
          test "$conclusion" = success
