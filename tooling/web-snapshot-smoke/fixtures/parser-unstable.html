<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Parser-unstable static snapshot fixture</title>
    <style>
      html,
      body {
        margin: 0;
        background: #eef2ff;
        color: #172554;
        font:
          16px/1.4 Arial,
          sans-serif;
      }
      .shell {
        padding: 24px;
      }
      .unstable {
        margin: 13px;
        padding: 17px;
        border: 5px solid #7c3aed;
        background: #ddd6fe url('/fixture-mark.svg') no-repeat right 24px top 24px / 96px 96px;
      }
      p > div {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 11px;
        background: #fef3c7;
        padding: 9px;
      }
      table {
        border-collapse: collapse;
        margin-top: 19px;
      }
      table > tr {
        background: #bbf7d0;
      }
      td {
        border: 3px solid #166534;
        padding: 12px;
      }
      pre {
        white-space: pre-wrap;
        background: #bae6fd;
        padding: 15px;
      }
      .pseudo::before {
        content: 'pseudo';
        color: #dc2626;
        margin-right: 8px;
      }
      snapshot-shadow-card {
        display: block;
        margin-top: 19px;
      }
    </style>
  </head>
  <body>
    <main class="shell"><section class="unstable"></section></main>
    <script>
      const host = document.querySelector('.unstable');
      const paragraph = document.createElement('p');
      paragraph.className = 'pseudo';
      const block = document.createElement('div');
      block.innerHTML = '<span>one</span><strong>two</strong>';
      paragraph.append(block);
      const table = document.createElement('table');
      const row = document.createElement('tr');
      row.innerHTML = '<td>A</td><td>B</td>';
      table.append(row);
      const pre = document.createElement('pre');
      pre.textContent = 'first\rsecond';
      const shadowHost = document.createElement('snapshot-shadow-card');
      const shadow = shadowHost.attachShadow({ mode: 'open' });
      shadow.innerHTML = `<style>
        :host { display: block; }
        article { display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: center; padding: 14px; border: 4px solid #0f766e; background: #ccfbf1; }
        img { width: 72px; height: 72px; }
        strong { color: #115e59; font-size: 20px; }
      </style><article><img src="/fixture-mark.svg" alt=""><strong>Open shadow retained inside parser-unstable XHTML</strong></article>`;
      host.append(paragraph, table, pre, shadowHost);
    </script>
  </body>
</html>
