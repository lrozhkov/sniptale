    - kind: import_statement
    - regex: '(?:shared/components(?:/index)?|popup/components/PopupActionButton)'
---
id: design-system-raw-family-class
language: Tsx
severity: error
message: Use the canonical design-system component instead of raw product-family classes.
rule:
  all:
    - any:
        - pattern:
            context: '<div className="$VALUE" />'
            selector: jsx_attribute
        - pattern:
            context: '<div className={$VALUE} />'
            selector: jsx_attribute
    - regex: '^className\s*=.*\bsniptale-(?:modal(?:-(?:backdrop|accent|header|close|body|footer))?|input|textarea|btn-(?:primary|secondary)|glass-(?:toolbar(?:-(?:button|divider))?|icon-button|chip|switch|range|input|mini-button|preset-(?:list|item|preview|meta|name)|color-(?:trigger|option|row)|bold-button|row|grid-3|dim)|dropdown-(?:menu|item|divider)|popover-(?:menu|item|divider)|toolbar-menu-(?:item|title|list|item-copy|item-label|item-hint|item-badge)|confirm-(?:dialog|title|message|actions|cancel|danger)|toast-(?:icon|icon-wrapper|message)|countdown-(?:toast-container|toast|main|icon|copy|label|number|suffix|cancel))(?:\s|[''"`}])'
---
id: design-system-direct-body-portal-ts
language: TypeScript
severity: error
message: Use the theme-safe portal owner instead of portalling directly to document.body.
rule:
  pattern: createPortal($CONTENT, document.body)
---
