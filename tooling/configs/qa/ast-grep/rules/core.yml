id: browser-action-direct
language: TypeScript
severity: error
message: Use @sniptale/platform/browser/action for chrome.action badge/title access.
rule:
  pattern: chrome.action.$METHOD($$$ARGS)
constraints:
  METHOD: { regex: '^(?:setTitle|setBadgeText|setBadgeBackgroundColor)$' }
