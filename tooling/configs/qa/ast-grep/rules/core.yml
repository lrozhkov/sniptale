id: browser-local-storage-direct
language: TypeScript
severity: error
message: Use a canonical owner seam for localStorage access; do not access it directly from arbitrary production modules.
rule:
  pattern: $TARGET.$METHOD($$$ARGS)
constraints:
  TARGET: { regex: '^(?:localStorage|window\.localStorage)$' }
  METHOD: { regex: '^(?:getItem|setItem|removeItem|clear)$' }
---
id: browser-history-direct
language: TypeScript
severity: error
message: Use a canonical owner seam for history mutations outside registered runtime owners.
rule:
  pattern: $TARGET.$METHOD($$$ARGS)
constraints:
  TARGET: { regex: '^(?:history|window\.history)$' }
  METHOD: { regex: '^(?:pushState|replaceState|back|forward)$' }
---
id: browser-broadcast-channel-direct
language: TypeScript
severity: error
message: Use a canonical owner seam for BroadcastChannel construction.
rule:
