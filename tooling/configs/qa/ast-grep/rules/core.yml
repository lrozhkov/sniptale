id: design-system-legacy-import-ts
language: TypeScript
severity: error
message: Use the canonical design-system owner instead of a retired UI import.
rule:
  all:
    - kind: import_statement
    - regex: '(?:shared/components(?:/index)?|popup/components/PopupActionButton)'
---
id: design-system-legacy-import-tsx
